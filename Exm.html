<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Exam Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    radial-gradient(circle at top left,#1e3a8a,#020617 70%);
    min-height:100vh;
    padding:30px;
    color:white;
    overflow-x:hidden;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,215,0,0.2);
    border-radius:28px;
    padding:35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    box-shadow:
    0 10px 40px rgba(0,0,0,0.4),
    inset 0 0 20px rgba(255,215,0,0.05);
}

.logo-section h1{
    font-size:38px;
    font-weight:700;
    background:linear-gradient(to right,#ffffff,#FFD700);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo-section p{
    margin-top:8px;
    color:#cbd5e1;
}

.clock{
    font-size:18px;
    font-weight:600;
    color:#FFD700;
}

.card{
    margin-top:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:28px;
    padding:35px;
    border:1px solid rgba(255,215,0,0.15);
    box-shadow:
    0 10px 40px rgba(0,0,0,0.4);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
    margin-bottom:30px;
}

.input-box{
    position:relative;
}

.input-box input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
    outline:none;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.input-box input:focus{
    border-color:#FFD700;
    box-shadow:0 0 20px rgba(255,215,0,0.25);
}

input::placeholder{
    color:#cbd5e1;
}

.button-group{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.btn{
    padding:15px 28px;
    border:none;
    border-radius:16px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.add-btn{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    box-shadow:0 8px 25px rgba(37,99,235,0.4);
}

.add-btn:hover{
    transform:translateY(-3px);
}

.pdf-btn{
    background:linear-gradient(135deg,#FFD700,#d4a017);
    color:#111827;
    box-shadow:0 8px 25px rgba(255,215,0,0.35);
}

.pdf-btn:hover{
    transform:translateY(-3px);
}

.table-wrapper{
    overflow-x:auto;
    border-radius:22px;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
}

thead{
    background:linear-gradient(135deg,#FFD700,#d4a017);
}

thead th{
    color:#111827;
    padding:18px;
    text-align:left;
    font-size:15px;
}

tbody tr{
    background:rgba(255,255,255,0.05);
    transition:0.3s;
}

tbody tr:hover{
    background:rgba(255,255,255,0.1);
}

tbody td{
    padding:18px;
    color:#f8fafc;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.delete-btn{
    padding:10px 18px;
    border:none;
    border-radius:12px;
    background:#ef4444;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.delete-btn:hover{
    background:#dc2626;
}

.empty{
    text-align:center;
    padding:40px;
    color:#cbd5e1;
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    .header{
        padding:25px;
    }

    .logo-section h1{
        font-size:28px;
    }

    .card{
        padding:20px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <div class="logo-section">
            <h1>Exam Management</h1>
            <p>Modern School Exam Routine System</p>
        </div>

        <div class="clock" id="clock"></div>

    </div>

    <div class="card">

        <form id="examForm">

            <div class="form-grid">

                <div class="input-box">
                    <input type="text" id="examName" placeholder="Enter Exam Name" required>
                </div>

                <div class="input-box">
                    <input type="text" id="className" placeholder="Enter Class" required>
                </div>

                <div class="input-box">
                    <input type="date" id="examDate" required>
                </div>

            </div>

            <div class="button-group">

                <button type="submit" class="btn add-btn">
                    Add Exam
                </button>

                <button type="button" class="btn pdf-btn" onclick="downloadPDF()">
                    Download PDF
                </button>

            </div>

        </form>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Sl No</th>
                        <th>Exam Name</th>
                        <th>Class</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="examTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

const examForm = document.getElementById("examForm");
const examTable = document.getElementById("examTable");

let exams = JSON.parse(localStorage.getItem("modernExamData")) || [];

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =
    now.toLocaleDateString() + " • " +
    now.toLocaleTimeString();

}

setInterval(updateClock,1000);

function saveData(){

    localStorage.setItem(
        "modernExamData",
        JSON.stringify(exams)
    );

}

function renderTable(){

    examTable.innerHTML = "";

    if(exams.length === 0){

        examTable.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No Exams Added
                </td>
            </tr>
        `;

        return;
    }

    exams.forEach((exam,index)=>{

        examTable.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${exam.name}</td>
                <td>${exam.className}</td>
                <td>${exam.date}</td>
                <td>
                    <button class="delete-btn"
                    onclick="deleteExam(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;

    });

}

examForm.addEventListener("submit",(e)=>{

    e.preventDefault();

    const examName =
    document.getElementById("examName").value;

    const className =
    document.getElementById("className").value;

    const examDate =
    document.getElementById("examDate").value;

    exams.push({
        name:examName,
        className:className,
        date:examDate
    });

    saveData();
    renderTable();

    examForm.reset();

});

function deleteExam(index){

    exams.splice(index,1);

    saveData();
    renderTable();

}

function downloadPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    doc.setFontSize(22);
    doc.setTextColor(30,58,138);
    doc.text("Exam Routine",14,20);

    const tableColumn = [
        "Sl No",
        "Exam Name",
        "Class",
        "Date"
    ];

    const tableRows = [];

    exams.forEach((exam,index)=>{

        tableRows.push([
            index + 1,
            exam.name,
            exam.className,
            exam.date
        ]);

    });

    doc.autoTable({

        head:[tableColumn],
        body:tableRows,
        startY:30,

        theme:'grid',

        headStyles:{
            fillColor:[212,160,23],
            textColor:[17,24,39],
            fontStyle:'bold'
        },

        bodyStyles:{
            textColor:[30,41,59]
        },

        alternateRowStyles:{
            fillColor:[240,240,240]
        }

    });

    doc.save("Exam_Routine.pdf");

}

renderTable();
updateClock();

</script>

</body>
</html>
