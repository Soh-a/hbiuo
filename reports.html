<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai DRS Kids School - Financial Management Report</title>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- jsPDF-AutoTable Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 20px;
            color: #0f172a;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #002147;
            font-size: 20px;
            margin-bottom: 16px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
        }
        input, select {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-export {
            background-color: #002147;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-export:hover {
            background-color: #1e40af;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sai DRS Kids School — Financial Management Report</h1>

    <!-- Hidden image element if you use a logo -->
    <img id="schoolLogoImg" src="" alt="School Logo" style="display:none;" />

    <div class="controls">
        <div class="control-group">
            <label for="repSearch">Search Student / ID</label>
            <input type="text" id="repSearch" placeholder="Type name..." oninput="exportDataToPDF ? null : null" />
        </div>
        <div class="control-group">
            <label for="repClass">Filter Class</label>
            <select id="repClass">
                <option value="">All Classes</option>
                <option value="IK1">IK1</option>
                <option value="IK2">IK2</option>
                <option value="IK3">IK3</option>
                <option value="1">Class 1</option>
                <option value="2">Class 2</option>
                <option value="3">Class 3</option>
                <option value="4">Class 4</option>
            </select>
        </div>
        <div class="control-group">
            <label for="repStatus">Filter Payment Status</label>
            <select id="repStatus">
                <option value="">All Statuses</option>
                <option value="paid">Paid</option>
                <option value="unpaid">Unpaid</option>
            </select>
        </div>
        <div class="control-group">
            <label for="repMonth">Filter Month</label>
            <select id="repMonth">
                <option value="">All Months</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
            </select>
        </div>
    </div>

    <button class="btn-export" onclick="exportDataToPDF()">Export Financial Statement to PDF</button>
</div>

<script>
// Mock cached report data matching your school setup
const localReportsCache = [
    { id: "101", name: "Gourav Sarmah", class: "1", month: "April", monthlyfee: 1200, fine: 0, amount: 1200, status: "paid" },
    { id: "101", name: "Gourav Sarmah", class: "1", month: "May", monthlyfee: 1200, fine: 0, amount: 1200, status: "unpaid" },
    { id: "101", name: "Gourav Sarmah", class: "1", month: "June", monthlyfee: 1200, fine: 0, amount: 1200, status: "unpaid" },
    { id: "101", name: "Gourav Sarmah", class: "1", month: "January", monthlyfee: 1200, fine: 0, amount: 1200, status: "unpaid" },
    { id: "102", name: "Ananya Das", class: "IK1", month: "April", monthlyfee: 1500, fine: 0, amount: 1500, status: "paid" },
    { id: "102", name: "Ananya Das", class: "IK1", month: "May", monthlyfee: 1500, fine: 0, amount: 1500, status: "paid" }
];

function exportDataToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p", "mm", "a4");

    const PAGE_WIDTH = 210;
    const PAGE_HEIGHT = 297;
    const MARGIN = 12;
    const CONTENT_WIDTH = PAGE_WIDTH - (MARGIN * 2); // 186mm

    // Professional Color Palette
    const COLOR_NAVY = [0, 33, 71];        // Deep Navy Blue
    const COLOR_ROYAL = [30, 64, 175];     // Royal Blue
    const COLOR_LIGHT_BLUE = [224, 242, 254]; // Soft Accent Background
    const COLOR_ALT_ROW = [248, 250, 252];  // Very Light Grey
    const COLOR_DARK_TEXT = [15, 23, 42];   // Slate Dark
    const COLOR_MUTED_TEXT = [71, 85, 105]; // Secondary Text
    const COLOR_BORDER = [203, 213, 225];   // Light Border

    // Status Colors
    const STATUS_PAID_TEXT = [21, 128, 61];     // Dark Green
    const STATUS_PAID_BG = [240, 253, 244];      // Light Green
    const STATUS_UNPAID_TEXT = [185, 28, 28];   // Dark Red
    const STATUS_UNPAID_BG = [254, 242, 242];    // Light Red
    const STATUS_PENDING_TEXT = [180, 83, 9];   // Dark Orange
    const STATUS_PENDING_BG = [255, 251, 235];  // Light Orange

    const today = new Date();
    const dateFormatted = today.toLocaleDateString("en-IN", { day: "2-digit", month: "2-digit", year: "numeric" });
    const fileDate = today.toISOString().split("T")[0];

    // Read UI Filter Controls
    const activeSearchQuery = document.getElementById("repSearch").value.trim();
    const activeClassFilter = document.getElementById("repClass").value;
    const activeStatusFilter = document.getElementById("repStatus").value;
    const activeMonthFilter = document.getElementById("repMonth").value;

    const dataset = localReportsCache.filter(record => {
        const query = activeSearchQuery.toLowerCase();
        const matchSearch = query === "" || String(record.name || "").toLowerCase().includes(query) || String(record.id || "").toLowerCase().includes(query);
        const matchClass = activeClassFilter === "" || String(record.class) === String(activeClassFilter);
        const matchStatus = activeStatusFilter === "" || record.status === activeStatusFilter;
        const matchMonth = activeMonthFilter === "" || String(record.month).toLowerCase() === activeMonthFilter.toLowerCase();
        return matchSearch && matchClass && matchStatus && matchMonth;
    });

    // Calculate Summary Totals
    let grossDemand = 0;
    let grossCollected = 0;
    let grossFine = 0;
    let grossOutstanding = 0;
    let paidAccountsCount = 0;
    let unpaidAccountsCount = 0;

    const monthStats = {};
    const monthOrder = ["April", "May", "June", "July", "August", "September", "October", "November", "December", "January", "February", "March"];
    monthOrder.forEach(m => { monthStats[m] = { demand: 0, collected: 0, outstanding: 0 }; });

    dataset.forEach(item => {
        const fee = Number(item.monthlyfee || 0);
        const fine = Number(item.fine || 0);
        const total = Number(item.amount || 0);
        const m = item.month || "April";

        grossDemand += total;
        grossFine += fine;

        if (!monthStats[m]) monthStats[m] = { demand: 0, collected: 0, outstanding: 0 };
        monthStats[m].demand += total;

        if (item.status === "paid") {
            grossCollected += total;
            paidAccountsCount++;
            monthStats[m].collected += total;
        } else {
            grossOutstanding += total;
            unpaidAccountsCount++;
            monthStats[m].outstanding += total;
        }
    });

    // Currency Formatter replacing Unicode Rupee with 'Rs.' to prevent corrupt font characters
    function fmtMoney(val) {
        return "Rs. " + Number(val || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Header Letterhead
    function renderLetterhead(y) {
        const logoImg = document.getElementById("schoolLogoImg");
        let hasLogo = false;
        
        if (logoImg && logoImg.complete && logoImg.naturalWidth !== 0) {
            try {
                const canvas = document.createElement("canvas");
                canvas.width = logoImg.naturalWidth;
                canvas.height = logoImg.naturalHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(logoImg, 0, 0);
                const imgData = canvas.toDataURL("image/jpeg");
                doc.addImage(imgData, "JPEG", MARGIN, y, 18, 18);
                hasLogo = true;
            } catch (e) {
                hasLogo = false;
            }
        }

        const textCenterX = hasLogo ? (MARGIN + 18 + (CONTENT_WIDTH - 18) / 2) : (PAGE_WIDTH / 2);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.setTextColor(...COLOR_NAVY);
        doc.text("SAI DRS KIDS SCHOOL", textCenterX, y + 5, { align: "center" });

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        doc.setTextColor(...COLOR_MUTED_TEXT);
        doc.text("Managed by SAAI Scholars Society", textCenterX, y + 10, { align: "center" });
        doc.setFontSize(8.5);
        doc.text("Jonali, Zoo Road, Guwahati – 781024 | Email: sai.drs.kids.school@gmail.com", textCenterX, y + 14.5, { align: "center" });

        // Divider Lines
        const lineY = y + 18;
        doc.setDrawColor(...COLOR_ROYAL);
        doc.setLineWidth(0.8);
        doc.line(MARGIN, lineY, PAGE_WIDTH - MARGIN, lineY);

        doc.setDrawColor(...COLOR_BORDER);
        doc.setLineWidth(0.2);
        doc.line(MARGIN, lineY + 1.2, PAGE_WIDTH - MARGIN, lineY + 1.2);

        // Title Banner
        const bannerY = lineY + 5;
        doc.setFillColor(...COLOR_LIGHT_BLUE);
        doc.rect(MARGIN, bannerY, CONTENT_WIDTH, 10, "F");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(...COLOR_NAVY);
        doc.text("FINANCIAL MANAGEMENT REPORT", PAGE_WIDTH / 2, bannerY + 6.5, { align: "center" });

        doc.setFont("helvetica", "bold");
        doc.setFontSize(9);
        doc.setTextColor(...COLOR_DARK_TEXT);
        doc.text("Academic Session: 2026–27", PAGE_WIDTH / 2, bannerY + 14.5, { align: "center" });

        doc.setFont("helvetica", "italic");
        doc.setFontSize(8);
        doc.setTextColor(...COLOR_MUTED_TEXT);
        doc.text("Prepared & Submitted by: Accounts Department", PAGE_WIDTH / 2, bannerY + 18.5, { align: "center" });

        return bannerY + 23;
    }

    let currentY = renderLetterhead(10);

    // Section 1: Report Details Table
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("1. REPORT DETAILS", MARGIN, currentY);

    const reportDetailsRows = [
        [
            { content: "Report Period:", styles: { fontStyle: "bold", fillColor: COLOR_LIGHT_BLUE, textColor: COLOR_NAVY } },
            activeMonthFilter ? `Month of ${activeMonthFilter}` : "Annual Session 2026–27",
            { content: "Report Date:", styles: { fontStyle: "bold", fillColor: COLOR_LIGHT_BLUE, textColor: COLOR_NAVY } },
            dateFormatted
        ],
        [
            { content: "Prepared By:", styles: { fontStyle: "bold", fillColor: COLOR_LIGHT_BLUE, textColor: COLOR_NAVY } },
            "School Accountant",
            { content: "Total Students Billed:", styles: { fontStyle: "bold", fillColor: COLOR_LIGHT_BLUE, textColor: COLOR_NAVY } },
            String(dataset.length)
        ],
        [
            { content: "Academic Session:", styles: { fontStyle: "bold", fillColor: COLOR_LIGHT_BLUE, textColor: COLOR_NAVY } },
            "2026–27",
            { content: "Filter Scope:", styles: { fontStyle: "bold", fillColor: COLOR_LIGHT_BLUE, textColor: COLOR_NAVY } },
            `Class: ${activeClassFilter || "All"} | Status: ${activeStatusFilter || "All"}`
        ]
    ];

    doc.autoTable({
        startY: currentY + 2,
        body: reportDetailsRows,
        theme: "plain",
        styles: { font: "helvetica", fontSize: 8, textColor: COLOR_DARK_TEXT, lineColor: COLOR_BORDER, lineWidth: 0.2, cellPadding: 2 },
        columnStyles: {
            0: { cellWidth: 35 },
            1: { cellWidth: 58 },
            2: { cellWidth: 35 },
            3: { cellWidth: 58 }
        },
        margin: { left: MARGIN, right: MARGIN }
    });

    currentY = doc.lastAutoTable.finalY + 6;

    // Section 2: Financial Summary Table
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("2. FINANCIAL SUMMARY", MARGIN, currentY);

    const summaryRows = [
        ["Total Fee Demand (Gross Expected Revenue)", fmtMoney(grossDemand)],
        ["Total Fee Collected", fmtMoney(grossCollected)],
        ["Total Fine Collected", fmtMoney(grossFine)],
        ["Total Outstanding Balance", fmtMoney(grossOutstanding)],
        ["Paid Accounts", String(paidAccountsCount)],
        ["Unpaid Accounts", String(unpaidAccountsCount)]
    ];

    doc.autoTable({
        startY: currentY + 2,
        head: [["Particulars", "Amount / Count"]],
        body: summaryRows,
        theme: "plain",
        styles: { font: "helvetica", fontSize: 8.5, textColor: COLOR_DARK_TEXT, lineColor: COLOR_BORDER, lineWidth: 0.2, cellPadding: 2.5 },
        headStyles: { fillColor: COLOR_NAVY, textColor: [255, 255, 255], fontStyle: "bold", halign: "left" },
        columnStyles: {
            0: { cellWidth: 120 },
            1: { cellWidth: 66, halign: "right", fontStyle: "bold" }
        },
        margin: { left: MARGIN, right: MARGIN },
        didParseCell: function(data) {
            if (data.section === "body") {
                if (data.row.index === 1) data.cell.styles.textColor = STATUS_PAID_TEXT;
                if (data.row.index === 3) data.cell.styles.textColor = STATUS_UNPAID_TEXT;
            }
        }
    });

    currentY = doc.lastAutoTable.finalY + 6;

    // Section 3: Month-Wise Collection Statement Table
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("3. MONTH-WISE FEE COLLECTION STATEMENT", MARGIN, currentY);

    const monthRows = [];
    monthOrder.forEach((m) => {
        const data = monthStats[m];
        if (data && data.demand > 0) {
            monthRows.push([
                m,
                fmtMoney(data.demand),
                fmtMoney(data.collected),
                fmtMoney(data.outstanding)
            ]);
        }
    });

    monthRows.push([
        "TOTAL",
        fmtMoney(grossDemand),
        fmtMoney(grossCollected),
        fmtMoney(grossOutstanding)
    ]);

    doc.autoTable({
        startY: currentY + 2,
        head: [["Month", "Total Demand", "Amount Collected", "Outstanding"]],
        body: monthRows,
        theme: "plain",
        styles: { font: "helvetica", fontSize: 8, textColor: COLOR_DARK_TEXT, lineColor: COLOR_BORDER, lineWidth: 0.2, cellPadding: 2 },
        headStyles: { fillColor: COLOR_NAVY, textColor: [255, 255, 255], fontStyle: "bold", halign: "center" },
        columnStyles: {
            0: { cellWidth: 42, halign: "left" },
            1: { cellWidth: 48, halign: "right" },
            2: { cellWidth: 48, halign: "right" },
            3: { cellWidth: 48, halign: "right" }
        },
        margin: { left: MARGIN, right: MARGIN },
        didParseCell: function(data) {
            if (data.section === "body") {
                if (data.column.index === 2) data.cell.styles.textColor = STATUS_PAID_TEXT;
                if (data.column.index === 3) data.cell.styles.textColor = STATUS_UNPAID_TEXT;

                if (data.row.index === monthRows.length - 1) {
                    data.cell.styles.fontStyle = "bold";
                    data.cell.styles.fillColor = COLOR_LIGHT_BLUE;
                    data.cell.styles.lineColor = COLOR_NAVY;
                }
            }
        }
    });

    currentY = doc.lastAutoTable.finalY + 6;

    // Section 4: Student-Wise Fee Collection Statement Table
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("4. STUDENT-WISE FEE COLLECTION STATEMENT", MARGIN, currentY);

    const studentTableBody = dataset.map((item, index) => {
        const fee = Number(item.monthlyfee || 0);
        const fine = Number(item.fine || 0);
        const total = Number(item.amount || 0);
        const paid = item.status === "paid" ? total : 0;
        const balance = total - paid;
        const clsLabel = item.class.startsWith("IK") ? item.class : "Class " + item.class;

        return [
            String(index + 1),
            item.name,
            clsLabel,
            item.month,
            "Rs. " + fee,
            "Rs. " + fine,
            "Rs. " + total,
            "Rs. " + paid,
            "Rs. " + balance,
            item.status.toUpperCase()
        ];
    });

    // Append Total Row
    studentTableBody.push([
        "", "TOTAL", "", "",
        "Rs. " + grossDemand,
        "Rs. " + grossFine,
        "Rs. " + grossDemand,
        "Rs. " + grossCollected,
        "Rs. " + grossOutstanding,
        ""
    ]);

    doc.autoTable({
        startY: currentY + 2,
        head: [["Sl. No.", "Student Name", "Class", "Month", "Fee", "Fine", "Total", "Paid", "Balance", "Status"]],
        body: studentTableBody,
        theme: "plain",
        styles: { font: "helvetica", fontSize: 7.5, textColor: COLOR_DARK_TEXT, lineColor: COLOR_BORDER, lineWidth: 0.2, cellPadding: 2, valign: "middle" },
        headStyles: { fillColor: COLOR_NAVY, textColor: [255, 255, 255], fontStyle: "bold", halign: "center" },
        alternateRowStyles: { fillColor: COLOR_ALT_ROW },
        columnStyles: {
            0: { cellWidth: 10, halign: "center" },
            1: { cellWidth: 38, halign: "left" },
            2: { cellWidth: 14, halign: "center" },
            3: { cellWidth: 17, halign: "center" },
            4: { cellWidth: 16, halign: "right" },
            5: { cellWidth: 14, halign: "right" },
            6: { cellWidth: 18, halign: "right" },
            7: { cellWidth: 18, halign: "right" },
            8: { cellWidth: 18, halign: "right" },
            9: { cellWidth: 23, halign: "center" }
        },
        margin: { left: MARGIN, right: MARGIN },
        showHead: "everyPage",
        rowPageBreak: "avoid",
        didParseCell: function(data) {
            if (data.section === "body") {
                if (data.column.index === 9) {
                    const status = String(data.cell.raw || "").toUpperCase();
                    data.cell.styles.fontStyle = "bold";
                    if (status === "PAID") {
                        data.cell.styles.textColor = STATUS_PAID_TEXT;
                        data.cell.styles.fillColor = STATUS_PAID_BG;
                    } else if (status === "UNPAID") {
                        data.cell.styles.textColor = STATUS_UNPAID_TEXT;
                        data.cell.styles.fillColor = STATUS_UNPAID_BG;
                    } else if (status === "PENDING") {
                        data.cell.styles.textColor = STATUS_PENDING_TEXT;
                        data.cell.styles.fillColor = STATUS_PENDING_BG;
                    }
                }

                if (data.row.index === studentTableBody.length - 1) {
                    data.cell.styles.fontStyle = "bold";
                    data.cell.styles.fillColor = COLOR_LIGHT_BLUE;
                    data.cell.styles.lineColor = COLOR_NAVY;
                }
            }
        }
    });

    currentY = doc.lastAutoTable.finalY + 6;

    if (currentY > PAGE_HEIGHT - 65) {
        doc.addPage();
        currentY = 20;
    }

    // Section 5: Accountant's Remarks / Observations
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("ACCOUNTANT'S REMARKS / OBSERVATIONS", MARGIN, currentY);

    doc.setDrawColor(...COLOR_NAVY);
    doc.setLineWidth(0.3);
    doc.rect(MARGIN, currentY + 2, CONTENT_WIDTH, 18);

    doc.setDrawColor(...COLOR_BORDER);
    doc.setLineWidth(0.2);
    doc.line(MARGIN + 2, currentY + 8, MARGIN + CONTENT_WIDTH - 2, currentY + 8);
    doc.line(MARGIN + 2, currentY + 14, MARGIN + CONTENT_WIDTH - 2, currentY + 14);

    currentY += 24;

    // Section 6: Certification Block
    doc.setDrawColor(...COLOR_BORDER);
    doc.setFillColor(...COLOR_ALT_ROW);
    doc.rect(MARGIN, currentY, CONTENT_WIDTH, 11, "FD");

    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("CERTIFICATION:", MARGIN + 3, currentY + 4.5);
    doc.setFont("helvetica", "italic");
    doc.setFontSize(7.5);
    doc.setTextColor(...COLOR_DARK_TEXT);
    doc.text('"I hereby certify that the above statement has been prepared from the available school fee and financial records for the stated reporting period and is submitted for verification and official record."', MARGIN + 28, currentY + 4.5, { maxWidth: CONTENT_WIDTH - 30 });

    currentY += 16;

    // Section 7: Signature Block
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.setTextColor(...COLOR_NAVY);

    const sigColWidth = CONTENT_WIDTH / 3;

    // Prepared By
    doc.text("Prepared By", MARGIN, currentY);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(...COLOR_MUTED_TEXT);
    doc.text("Accountant", MARGIN, currentY + 4);
    doc.setDrawColor(...COLOR_BORDER);
    doc.line(MARGIN, currentY + 14, MARGIN + 45, currentY + 14);
    doc.text("Signature: _____________", MARGIN, currentY + 19);
    doc.text("Date: ____ / ____ / _______", MARGIN, currentY + 23);

    // Checked By
    const col2X = MARGIN + sigColWidth;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("Checked By", col2X, currentY);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(...COLOR_MUTED_TEXT);
    doc.text("Principal / Authorized Officer", col2X, currentY + 4);
    doc.line(col2X, currentY + 14, col2X + 45, currentY + 14);
    doc.text("Signature: _____________", col2X, currentY + 19);
    doc.text("Date: ____ / ____ / _______", col2X, currentY + 23);

    // Approved By
    const col3X = MARGIN + (sigColWidth * 2);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.setTextColor(...COLOR_NAVY);
    doc.text("Approved By", col3X, currentY);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(...COLOR_MUTED_TEXT);
    doc.text("School Management", col3X, currentY + 4);
    doc.line(col3X, currentY + 14, col3X + 45, currentY + 14);
    doc.text("Signature: _____________", col3X, currentY + 19);
    doc.text("Date: ____ / ____ / _______", col3X, currentY + 23);

    // Footer & Page Numbers
    const totalPages = doc.internal.getNumberOfPages();
    for (let page = 1; page <= totalPages; page++) {
        doc.setPage(page);

        doc.setDrawColor(...COLOR_NAVY);
        doc.setLineWidth(0.4);
        doc.line(MARGIN, 283, PAGE_WIDTH - MARGIN, 283);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(...COLOR_MUTED_TEXT);
        doc.text("SAI DRS KIDS SCHOOL  |  Financial Management Report  |  Academic Session 2026–27", MARGIN, 288);
        doc.text(`Page ${page} of ${totalPages}`, PAGE_WIDTH - MARGIN, 288, { align: "right" });
