<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERP – Add Staff</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:40px;
}
.container{
  background:#fff;
  max-width:600px;
  margin:auto;
  padding:30px;
  border-radius:10px;
  box-shadow:0 0 15px rgba(0,0,0,.1);
}
h2{
  text-align:center;
  color:#1e40af;
}
input, select, button{
  width:100%;
  padding:12px;
  margin-top:10px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.success{
  color:green;
  margin-top:10px;
}
.error{
  color:red;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Add Staff (ERP Developer)</h2>

  <input type="text" id="name" placeholder="Full Name">
  
  <select id="role">
    <option value="">Select Role</option>
    <option>Teacher</option>
    <option>Office Staff</option>
    <option>Accountant</option>
    <option>Helper</option>
  </select>

  <input type="text" id="username" placeholder="Login Username (Phone)">
  <input type="password" id="password" placeholder="Login Password">

  <input type="text" id="subject" placeholder="Subject (For Teacher)">
  <input type="text" id="assignedClass" placeholder="Assigned Class">

  <input type="text" id="phone" placeholder="Phone Number">
  <input type="email" id="email" placeholder="Email">

  <button onclick="addStaff()">Add Staff</button>

  <p id="msg"></p>
</div>

<script>
/* 🔹 Firebase Config */
var firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
};
firebase.initializeApp(firebaseConfig);

function addStaff(){
  const name = nameEl.value.trim();
  const role = roleEl.value;
  const username = usernameEl.value.trim();
  const password = passwordEl.value.trim();
  const subject = subjectEl.value.trim();
  const assignedClass = classEl.value.trim();
  const phone = phoneEl.value.trim();
  const email = emailEl.value.trim();

  if(!name || !role || !username || !password){
    showMsg("Please fill required fields","error");
    return;
  }

  const staffId = "STF" + Date.now();

  firebase.database().ref("staff/" + staffId).set({
    name,
    role,
    username,
    password,
    subject: subject || "-",
    assignedClass: assignedClass || "-",
    phone,
    email,
    status: "Active",
    createdAt: new Date().toISOString().slice(0,10)
  }).then(()=>{
    showMsg("Staff added successfully","success");
    document.querySelectorAll("input").forEach(i=>i.value="");
    document.getElementById("role").value="";
  });
}

/* Helpers */
const nameEl = document.getElementById("name");
const roleEl = document.getElementById("role");
const usernameEl = document.getElementById("username");
const passwordEl = document.getElementById("password");
const subjectEl = document.getElementById("subject");
const classEl = document.getElementById("assignedClass");
const phoneEl = document.getElementById("phone");
const emailEl = document.getElementById("email");

function showMsg(text,type){
  const m = document.getElementById("msg");
  m.className = type;
  m.innerText = text;
}
</script>

</body>
</html>
