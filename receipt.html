<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Fee Receipt</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI;background:#eef2ff}
.container{max-width:800px;margin:30px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
h2{text-align:center;color:#1e3a8a}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{background:#2563eb;color:#fff;font-weight:bold;border:none}
.month-box{margin-top:20px;padding:15px;border-radius:10px;background:#f8fafc}
.month{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ccc}
.generate{background:#16a34a;margin-top:15px}
</style>
</head>

<body>
<div class="container">
<h2>Modern Fee Receipt Generator</h2>

<input id="mobile" placeholder="Enter Mobile Number">
<button onclick="fetchStudent()">Fetch Student</button>

<div id="studentInfo"></div>
<div id="monthsBox"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain:"students-6e271.firebaseapp.com",
  databaseURL:"https://students-6e271-default-rtdb.firebaseio.com",
  projectId:"students-6e271"
});

const db = firebase.database();
let studentData = {}, mobileNo="";

function fetchStudent(){
  mobileNo = mobile.value.trim();
  studentInfo.innerHTML="Loading...";
  monthsBox.innerHTML="";

  db.ref(mobileNo).once("value",snap=>{
    if(!snap.exists()){
      studentInfo.innerHTML="❌ Not found";
      return;
    }

    studentData = snap.val();

    studentInfo.innerHTML = `
    <b>Name:</b> ${studentData.name}<br>
    <b>Class:</b> ${studentData.class}<br>`;

    showMonths();
  });
}

function showMonths(){
  let html = `<div class="month-box"><b>Select Months</b>`;

  for(let m in studentData.fees){
    if(studentData.fees[m].status==="paid"){
      const amt = Number(studentData.monthlyfee);
      html += `
      <div class="month">
      <label><input type="checkbox" value="${m}"> ${m.toUpperCase()}</label>
      ₹${amt}
      </div>`;
    }
  }

  html += `<button class="generate" onclick="generatePDF()">Generate Receipt</button></div>`;
  monthsBox.innerHTML = html;
}

function generatePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  doc.setFont("helvetica","bold");
  doc.setFontSize(18);
  doc.text("SAI DRS KIDS SCHOOL",105,y,{align:"center"});

  y+=6;
  doc.setFontSize(10);
  doc.setFont("helvetica","normal");
  doc.text("(Managed by SAAI Scholars Society)",105,y,{align:"center"});

  y+=5;
  doc.text("Guwahati, Assam",105,y,{align:"center"});

  y+=10;
  doc.setDrawColor(0);
  doc.line(20,y,190,y);

  y+=10;
  doc.setFontSize(14);
  doc.setFont("helvetica","bold");
  doc.text("TUITION FEE RECEIPT",105,y,{align:"center"});

  y+=10;
  doc.setFontSize(11);
  doc.setFont("helvetica","normal");

  doc.text(`Date: ${new Date().toLocaleDateString()}`,150,y);

  y+=10;
  doc.text(`Student Name: ${studentData.name}`,20,y);
  y+=8;
  doc.text(`Class: ${studentData.class}`,20,y);

  y+=12;
  doc.text("Fee Details:",20,y);

  y+=8;
  doc.setFont("helvetica","bold");
  doc.text("Month",20,y);
  doc.text("Amount (₹)",150,y);

  doc.setFont("helvetica","normal");

  let total=0;
  document.querySelectorAll("input:checked").forEach(cb=>{
    const amt = Number(studentData.monthlyfee);
    y+=8;
    doc.text(cb.value.toUpperCase(),20,y);
    doc.text(String(amt),150,y);
    total+=amt;
  });

  y+=12;
  doc.setFont("helvetica","bold");
  doc.text(`Total: ₹ ${total}`,150,y);

  y+=20;
  doc.setFont("helvetica","normal");
  doc.text("Payment Mode: Cash / UPI / Bank",20,y);

  y+=20;
  doc.line(20,y,80,y);
  doc.line(120,y,180,y);

  doc.text("Received By",30,y+5);
  doc.text("Signature",135,y+5);

  doc.save(`Receipt_${studentData.name}.pdf`);
}
</script>
</body>
</html>
