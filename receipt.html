<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Fee Receipt</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI;background:#eef2ff}
.container{max-width:800px;margin:30px auto;background:#fff;padding:25px;border-radius:12px}
input,button{width:100%;padding:12px;margin-top:10px}
button{background:#2563eb;color:#fff;border:none}
</style>
</head>

<body>

<div class="container">
<h2>School Fee Receipt</h2>

<input id="mobile" placeholder="Enter Mobile Number">
<button onclick="fetchStudent()">Fetch</button>

<div id="studentInfo"></div>
<div id="monthsBox"></div>
</div>

<script>

// FIREBASE
firebase.initializeApp({
  apiKey:"AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  databaseURL:"https://students-6e271-default-rtdb.firebaseio.com"
});

const db = firebase.database();
let studentData = {};

// FETCH STUDENT
function fetchStudent(){
  const mobile = document.getElementById("mobile").value;

  db.ref(mobile).once("value",snap=>{
    if(!snap.exists()){
      alert("Student not found");
      return;
    }

    studentData = snap.val();

    studentInfo.innerHTML = `
    <b>${studentData.name}</b><br>
    Class: ${studentData.class}`;

    showMonths();
  });
}

// SHOW MONTHS
function showMonths(){
  let html = "";

  for(let m in studentData.fees){
    if(studentData.fees[m].status==="paid"){
      html += `
      <label>
        <input type="checkbox" value="${m}">
        ${m.toUpperCase()}
      </label><br>`;
    }
  }

  html += `<button onclick="generatePDF()">Generate Receipt</button>`;
  monthsBox.innerHTML = html;
}

// NUMBER TO WORDS
function numberToWords(num){
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

  if(num<20) return a[num];
  if(num<100) return b[Math.floor(num/10)]+" "+a[num%10];
  if(num<1000) return a[Math.floor(num/100)]+" Hundred "+numberToWords(num%100);

  return num;
}

// PDF FUNCTION
function generatePDF(){
  const selected = document.querySelectorAll("input:checked");
  if(selected.length === 0){
    alert("Select at least one month");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const receiptNo = "FR/" + Math.floor(Math.random() * 100000);
  const today = new Date().toLocaleDateString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric'
  });

  const transactionNo = studentData.fees[selected[0].value]?.paymentId || "N/A";

  let total = 0;

  const feeItems = Array.from(selected).map((cb, index) => {
    const amt = Number(studentData.fees[cb.value]?.amount || studentData.monthlyfee);
    total += amt;

    const monthName = cb.value;
    const monthShort = monthName.substring(0, 3);

    // ✅ SESSION LOGIC (April 2026 to March 2027)
    const monthIndex = new Date(monthName + " 1, 2026").getMonth();
    const yearSuffix = (monthIndex >= 3) ? "26" : "27"; 

    const formattedMonth = monthShort.charAt(0).toUpperCase() + monthShort.slice(1) + "-" + yearSuffix;

    return {
      sno: index + 1,
      particulars: "Tuition Fee",
      month: formattedMonth,
      amount: amt.toLocaleString('en-IN', { minimumFractionDigits: 2 })
    };
  });

  function drawCopy(startY, title){
    let y = startY;

    // Header
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("SAI DRS KIDS SCHOOL", 105, y, { align: "center" });

    y += 5;
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text("R.G.B Road, Junali, Guwahati - 781024", 105, y, { align: "center" });
    doc.text("Email: sai.drs.kids.school@gmail.com", 105, y + 4, { align: "center" });

    y += 12;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text("FEE RECEIPT (2026-2027)", 105, y, { align: "center" });

    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text(`Receipt No: ${receiptNo}`, 15, y);
    doc.text(`Receipt Date: ${today}`, 195, y, { align: "right" });

    y += 6;
    doc.text(`Student Name: ${studentData.name.toUpperCase()}`, 15, y);
    doc.text(`Class: ${studentData.class}`, 195, y, { align: "right" });



    // Table
    y += 4;
    doc.line(15, y, 195, y);

    y += 5;
    doc.text("S.No", 17, y);
    doc.text("Particulars", 35, y);
    doc.text("Due Month", 90, y);
    doc.text("Due Amt.", 140, y);
    doc.text("Paid Amt.", 195, y, { align: "right" });

    y += 2;
    doc.line(15, y, 195, y);

    doc.setFont("helvetica", "normal");
    feeItems.forEach(item => {
      y += 7;
      doc.text(String(item.sno), 17, y);
      doc.text(item.particulars, 35, y);
      doc.text(item.month, 90, y);
      doc.text(item.amount, 140, y);
      doc.text(item.amount, 195, y, { align: "right" });
    });

    y += 4;
    doc.line(15, y, 195, y);

    // Summary - STRIPED STRAY '1' FIX
    y += 8;
    doc.setFont("helvetica", "bold");
    const totalStr = total.toLocaleString('en-IN', { minimumFractionDigits: 2 });
    doc.text("Total Paid Amount:", 15, y);
    doc.text(`Rs. ${totalStr}`, 195, y, { align: "right" });

    y += 6;
    doc.setFontSize(8);
    doc.setFont("helvetica", "normal");
    doc.text(`Amount In Words: INR ${numberToWords(total)} Only`, 15, y);

    y += 5;
    doc.text(`Payment Mode: Payment-Gateway`, 15, y);
    doc.text(`Transaction No: ${transactionNo}`, 80, y);

    y += 8;
    doc.setFontSize(7);
    doc.text("Note: Parents are requested to preserve this receipt.", 15, y);
    y += 3.5;
    doc.text("Fees once paid will not be refunded.", 15, y);

    y += 10;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.text("Cashier/Manager Signature", 195, y, { align: "right" });
  }

  // Generate Copies
  drawCopy(20, "Office Copy");
  doc.setLineDashPattern([2, 2], 0);
  doc.line(10, 148, 200, 148);
  doc.setLineDashPattern([], 0);
  drawCopy(160, "Parent Copy");

  doc.save(`Receipt_${studentData.name.replace(/\s+/g, '_')}.pdf`);
}

</script>

</body>
</html>
