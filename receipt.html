<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Fee Receipt System</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #16a34a;
  --primary-hover: #15803d;
  --accent-blue: #2563eb;
  --accent-blue-hover: #1d4ed8;
  --danger: #dc2626;
  --bg-main: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
}

body {
  font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  margin: 0;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 95vh;
}

.container {
  width: 100%;
  max-width: 460px;
  background: var(--card-bg);
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  border: 1px solid var(--border-color);
  box-sizing: border-box;
}

h2 {
  text-align: center;
  color: var(--text-main);
  margin-top: 0;
  margin-bottom: 24px;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.025em;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}

.search-box input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

.search-box input:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.btn-search {
  padding: 12px 20px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.2s;
}

.btn-search:hover {
  background: var(--accent-blue-hover);
}

#studentInfo {
  background: #f0fdf4;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 20px;
  border-left: 4px solid var(--primary);
  display: flex;
  align-items: center;
  gap: 12px;
}

#studentInfo i {
  color: var(--primary);
  font-size: 1.25rem;
}

.student-meta h4 {
  margin: 0;
  color: #14532d;
  font-size: 1rem;
  font-weight: 600;
}

.student-meta p {
  margin: 2px 0 0 0;
  color: #166534;
  font-size: 0.85rem;
}

.section-title {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: block;
}

.month-box {
  max-height: 260px;
  overflow-y: auto;
  border: 1px solid var(--border-color);
  border-radius: 14px;
  background: #fff;
  margin-bottom: 24px;
}

.month {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  transition: background 0.2s ease;
}

.month:last-child {
  border-bottom: none;
}

.month:hover {
  background: #f8fafc;
}

.month-label-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.month-label-group i {
  color: var(--primary);
  font-size: 0.95rem;
}

.month span {
  font-weight: 500;
  font-size: 0.95rem;
}

.checkbox-container {
  position: relative;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.checkbox-container input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

.checkmark {
  height: 22px;
  width: 22px;
  background-color: #f1f5f9;
  border: 2px solid var(--border-color);
  border-radius: 6px;
  transition: all 0.2s ease-in-out;
  display: inline-block;
  position: relative;
}

.checkbox-container:hover input ~ .checkmark {
  border-color: var(--primary);
}

.checkbox-container input:checked ~ .checkmark {
  background-color: var(--primary);
  border-color: var(--primary);
}

.checkmark:after {
  content: "";
  position: absolute;
  display: none;
}

.checkbox-container input:checked ~ .checkmark:after {
  display: block;
}

.checkbox-container .checkmark:after {
  left: 7px;
  top: 3px;
  width: 5px;
  height: 10px;
  border: solid white;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}

button.generate {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  background: var(--primary);
  color: #fff;
}

button.generate:hover {
  background: var(--primary-hover);
}

.no-data {
  padding: 30px 16px;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.no-data i {
  font-size: 2rem;
  color: var(--border-color);
  margin-bottom: 8px;
  display: block;
}
.error-text {
  color: var(--danger);
}
</style>
</head>

<body>

<div class="container">
  <h2>Advanced Fee Receipt System</h2>

  <div class="search-box">
    <input id="mobileInput" type="text" placeholder="Enter Registered Mobile Number" autocomplete="off">
    <button class="btn-search" onclick="fetchStudentData()">
      <i class="fas fa-search"></i> Search
    </button>
  </div>

  <div id="studentContainer" style="display: none;">
    <div id="studentInfo"></div>
    <span class="section-title">Select Paid Months</span>
    <div class="month-box" id="monthsBox"></div>
    <button class="generate" onclick="generatePDF()">
      <i class="fas fa-cloud-download-alt"></i> Download Receipt
    </button>
  </div>
</div>

<script>
// ================= FIREBASE INITIALIZATION =================
const firebaseConfig = {
    apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa-dTbc",
    authDomain: "students-6e271.firebaseapp.com",
    databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
    projectId: "students-6e271"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// Global tracking references
let dynamicFeesData = {}; 
let monthlyFeeAmount = 0;
let dbStudentName = "";
let dbStudentClass = "";
let dbAdmissionNo = "";
let mobileKey = "";

// ================= FETCH STUDENT VIA MOBILE NUMBER =================
function fetchStudentData() {
  const mobileInput = document.getElementById("mobileInput").value.trim();
  const studentContainer = document.getElementById("studentContainer");
  
  if (!mobileInput) {
    alert("Please enter a mobile number.");
    return;
  }

  mobileKey = String(mobileInput);
  studentContainer.style.display = "block";
  document.getElementById("studentInfo").innerHTML = `
    <i class="fas fa-circle-notch fa-spin"></i>
    <div class="student-meta"><h4>Searching record...</h4></div>
  `;
  document.getElementById("monthsBox").innerHTML = `
    <div class="no-data"><i class="fas fa-receipt"></i>Retrieving payment records...</div>
  `;

  // Attach single lookup event to targeted node path
  db.ref("students/" + mobileKey).once("value").then(snapshot => {
    const freshSnapshot = snapshot.val();
    
    if(!freshSnapshot) {
        document.getElementById("studentInfo").innerHTML = `
          <i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i>
          <div class="student-meta"><h4 class="error-text">Profile not found</h4><p>Check entry & search again</p></div>
        `;
        document.getElementById("monthsBox").innerHTML = "<div class='no-data'><i class='fas fa-exclamation-triangle'></i>No details available.</div>";
        return;
    }

    dynamicFeesData = freshSnapshot.fees || {};
    monthlyFeeAmount = Number(freshSnapshot.monthlyfee || 0);
    dbStudentName = freshSnapshot.name ? freshSnapshot.name.toUpperCase() : "STUDENT";
    dbStudentClass = freshSnapshot.class || "N/A";
    dbAdmissionNo = freshSnapshot.admissionNo || "N/A";

    document.getElementById("studentInfo").innerHTML = `
      <i class="fas fa-user"></i>
      <div class="student-meta">
        <h4>${dbStudentName}</h4>
        <p>Class: ${dbStudentClass} | Adm No: ${dbAdmissionNo}</p>
      </div>
    `;

    let html = "";
    Object.keys(dynamicFeesData).forEach(monthKey => {
        const data = dynamicFeesData[monthKey] || {};
        const status = String(data.status || "").trim().toLowerCase();

        if (status === "paid") {
            html += `
            <div class="month">
              <div class="month-label-group">
                <i class="fas fa-check-circle"></i>
                <span>${monthKey.toUpperCase()}</span>
              </div>
              <label class="checkbox-container">
                <input type="checkbox" value="${monthKey}">
                <span class="checkmark"></span>
              </label>
            </div>`;
        }
    });

    document.getElementById("monthsBox").innerHTML = html || `
      <div class="no-data">
        <i class="fas fa-info-circle"></i> No settled payments found for this profile.
      </div>`;
  }).catch(err => {
      console.error(err);
      alert("Error fetching student profile details.");
  });
}

// ================= NUMBER TO WORDS ENGINE (Indian Financial Structure) =================
function numberToWords(num) {
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

  if ((num = num.toString()).length > 9) return 'overflow';
  let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
  if (!n) return ''; 
  let str = '';
  str += (Number(n[1]) != 0) ? (a[Number(n[1])] || b[Math.floor(n[1]/10)] + ' ' + a[n[1]%10]) + ' Crore ' : '';
  str += (Number(n[2]) != 0) ? (a[Number(n[2])] || b[Math.floor(n[2]/10)] + ' ' + a[n[2]%10]) + ' Lakh ' : '';
  str += (Number(n[3]) != 0) ? (a[Number(n[3])] || b[Math.floor(n[3]/10)] + ' ' + a[n[3]%10]) + ' Thousand ' : '';
  str += (Number(n[4]) != 0) ? (a[Number(n[4])] || b[Math.floor(n[4]/10)] + ' ' + a[n[4]%10]) + ' Hundred ' : '';
  str += (Number(n[5]) != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[Math.floor(n[5]/10)] + ' ' + a[n[5]%10]) : '';
  return str.trim() ? str.trim() : "Zero";
}

// ================= PDF EXPORT GENERATOR =================
const logo = new Image();
logo.src = "logo.jpeg";

function generatePDF() {
  const selected = document.querySelectorAll("#monthsBox input:checked");

  if(selected.length === 0){
    alert("Select at least one month");
    return;
  }

  if(!logo.complete){
    alert("Logo image assets are loading. Please try again in a moment.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');

  const firstMonthKey = selected[0].value;
  const targetReceiptData = dynamicFeesData[firstMonthKey] || {};
  
  const receiptNo = targetReceiptData.receiptNo || "FR/" + Math.floor(100000 + Math.random() * 900000);
  const transactionNo = targetReceiptData.paymentId || targetReceiptData.transactionId || "N/A";
  const paymentMode = targetReceiptData.paymentMode || "Online Payment";
  
  const rawDate = targetReceiptData.paymentDate || new Date().toLocaleDateString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric'
  });

  let totalPaidAmount = 0;

  const feeItems = Array.from(selected).map((cb, index) => {
    const mName = cb.value;
    const mData = dynamicFeesData[mName] || {};
    const baseAmt = Number(mData.amountPaid || mData.amount || monthlyFeeAmount);

    totalPaidAmount += baseAmt;

    const monthShort = mName.substring(0, 3);
    const monthIndex = new Date(mName + " 1, 2026").getMonth();
    const yearSuffix = (monthIndex >= 3) ? "2026" : "2027";

    return {
      sno: index + 1,
      particulars: "School Tuition Fee",
      month: monthShort.charAt(0).toUpperCase() + monthShort.slice(1) + "-" + yearSuffix,
      amount: baseAmt
    };
  });

  function drawLayout(startY, layoutTitle) {
    let y = startY;

    // BRAND LOGO
    try {
      doc.addImage(logo, "JPEG", 15, y, 20, 20);
    } catch(e) {
      console.warn("Logo skipped.");
    }

    // HEADER DETAILS
    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.text("SAI DRS KIDS SCHOOL", 112, y + 4, { align: "center" });

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text("R.G.B Road, Junali, Guwahati - 781024", 112, y + 10, { align: "center" });
    doc.text("Email: sai.drs.kids.school@gmail.com", 112, y + 15, { align: "center" });

    y += 26;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text(`FEE RECEIPT (ACADEMIC YEAR 2026-2027) - [${layoutTitle.toUpperCase()}]`, 105, y, { align: "center" });

    // METADATA LABELS
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text(`Receipt No: ${receiptNo}`, 15, y);
    doc.text(`Receipt Date: ${rawDate}`, 195, y, { align: "right" });

    y += 5;
    doc.text(`Student Name: ${dbStudentName}`, 15, y);
    doc.text(`Class: ${dbStudentClass}`, 195, y, { align: "right" });

    y += 5;
    doc.text(`Admission No: ${dbAdmissionNo}`, 15, y);
    doc.text(`Mobile: ${mobileKey}`, 195, y, { align: "right" });

    // TABLE
    y += 4;
    doc.line(15, y, 195, y);
    y += 5;
    doc.setFont("helvetica", "bold");
    doc.text("S.No", 17, y);
    doc.text("Particulars Description", 35, y);
    doc.text("Session Term", 95, y);
    doc.text("Paid Amount", 195, y, { align: "right" });
    y += 2;
    doc.line(15, y, 195, y);

    doc.setFont("helvetica", "normal");
    feeItems.forEach(item => {
      y += 6;
      doc.text(String(item.sno), 17, y);
      doc.text(item.particulars, 35, y);
      doc.text(item.month, 95, y);
      doc.text(item.amount.toLocaleString('en-IN', { minimumFractionDigits: 2 }), 195, y, { align: "right" });
    });

    y += 3;
    doc.line(15, y, 195, y);

    // BALANCES SUMMARY BLOCK
    y += 6;
    doc.setFont("helvetica", "bold");
    doc.text("Total Paid Net Balance:", 135, y);
    doc.text(`INR ${totalPaidAmount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`, 195, y, { align: "right" });

    y += 6;
    doc.setFontSize(8.5);
    doc.setFont("helvetica", "normal");
    doc.text(`Amount In Words: INR ${numberToWords(totalPaidAmount)} Only`, 15, y);

    y += 5;
    doc.text(`Payment Mode: ${paymentMode.toUpperCase()}`, 15, y);
    doc.text(`Transaction / Reference ID: ${transactionNo}`, 80, y);

    y += 8;
    doc.setFontSize(7.5);
    doc.setFont("helvetica", "italic");
    doc.text("Note: Parents are requested to preserve this receipt. Fees once paid are non-refundable.", 15, y);

    y += 10;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.text("Authorized Cashier / Manager Signature", 195, y, { align: "right" });
  }

  // Generate layouts
  drawLayout(15, "Office Copy");
  
  doc.setLineDashPattern([2, 2], 0);
  doc.line(10, 148, 200, 148);
  doc.setLineDashPattern([], 0);

  drawLayout(155, "Parent Copy");

  const safeFilename = dbStudentName.replace(/\s+/g, '_');
  doc.save(`Receipt_${safeFilename}.pdf`);
}
</script>
</body>
</html>
