<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Fee Receipt</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family:Segoe UI;
  background:#eef2ff;
}
.container{
  max-width:800px;
  margin:30px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}
.month-item{
  display:flex;
  gap:10px;
  align-items:center;
  margin:5px 0;
}
</style>
</head>

<body>

<div class="container">
<h2>School Fee Receipt</h2>

<input id="mobile" placeholder="Enter Mobile Number">
<button onclick="fetchStudent()">Fetch</button>

<div id="studentInfo"></div>
<div id="monthsBox"></div>
</div>

<script>

// 🔥 FIREBASE CONFIG
firebase.initializeApp({
  apiKey:"AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  databaseURL:"https://students-6e271-default-rtdb.firebaseio.com"
});

const db = firebase.database();
let studentData = {};

// ✅ FETCH STUDENT
function fetchStudent(){
  const mobile = document.getElementById("mobile").value;
  studentInfo.innerHTML = "Loading...";

  db.ref(mobile).once("value",snap=>{
    if(!snap.exists()){
      alert("Student not found");
      studentInfo.innerHTML = "";
      return;
    }

    studentData = snap.val();

    studentInfo.innerHTML = `
    <b>${studentData.name}</b><br>
    Class: ${studentData.class}`;

    showMonths();
  });
}

// ✅ SHOW MONTHS
function showMonths(){
  let html = "";

  for(let m in studentData.fees){
    if(studentData.fees[m].status==="paid"){
      html += `
      <div class="month-item">
        <input type="checkbox" value="${m}">
        <span>${m.toUpperCase()}</span>
      </div>`;
    }
  }

  if(html === ""){
    html = "<p>No paid months found</p>";
  }

  html += `<button onclick="generatePDF()">Generate Receipt</button>`;
  monthsBox.innerHTML = html;
}

// ✅ NUMBER TO WORDS (Indian Format)
function numberToWords(num){
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

  if(num < 20) return a[num];
  if(num < 100) return b[Math.floor(num/10)] + " " + a[num%10];
  if(num < 1000) return a[Math.floor(num/100)] + " Hundred " + numberToWords(num%100);
  if(num < 100000) return numberToWords(Math.floor(num/1000)) + " Thousand " + numberToWords(num%1000);
  if(num < 10000000) return numberToWords(Math.floor(num/100000)) + " Lakh " + numberToWords(num%100000);

  return num;
}

// ✅ PDF GENERATION
function generatePDF(){
  const selected = document.querySelectorAll("#monthsBox input:checked");

  if(selected.length === 0){
    alert("Select at least one month");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const receiptNo = "FR/" + Date.now();
  const today = new Date().toLocaleDateString('en-GB', {
    day:'2-digit', month:'short', year:'numeric'
  });

  const transactionNo = studentData.fees[selected[0].value]?.paymentId || "N/A";

  let total = 0;

  const monthsOrder = [
    "april","may","june","july","august","september",
    "october","november","december","january","february","march"
  ];

  const feeItems = Array.from(selected).map((cb, index) => {

    const feeData = studentData.fees[cb.value] || {};
    const amt = Number(feeData.amount || studentData.monthlyfee || 0);
    total += amt;

    const monthName = cb.value.toLowerCase();
    const monthIndex = monthsOrder.indexOf(monthName);
    const yearSuffix = (monthIndex <= 8) ? "26" : "27";

    const formattedMonth =
      monthName.substring(0,3).toUpperCase() + "-" + yearSuffix;

    return {
      sno: index + 1,
      month: formattedMonth,
      amount: amt.toLocaleString('en-IN',{minimumFractionDigits:2})
    };
  });

  function drawCopy(startY){
    let y = startY;

    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.text("SAI DRS KIDS SCHOOL",105,y,{align:"center"});

    y+=5;
    doc.setFontSize(9);
    doc.setFont("helvetica","normal");
    doc.text("R.G.B Road, Junali, Guwahati - 781024",105,y,{align:"center"});
    doc.text("Email: sai.drs.kids.school@gmail.com",105,y+4,{align:"center"});

    y+=12;
    doc.setFont("helvetica","bold");
    doc.text("FEE RECEIPT (2026-2027)",105,y,{align:"center"});

    y+=8;
    doc.setFont("helvetica","normal");
    doc.text(`Receipt No: ${receiptNo}`,15,y);
    doc.text(`Date: ${today}`,195,y,{align:"right"});

    y+=6;
    doc.text(`Student: ${studentData.name.toUpperCase()}`,15,y);
    doc.text(`Class: ${studentData.class}`,195,y,{align:"right"});

    y+=4;
    doc.line(15,y,195,y);

    y+=6;
    doc.text("S.No",17,y);
    doc.text("Month",80,y);
    doc.text("Amount",195,y,{align:"right"});

    y+=2;
    doc.line(15,y,195,y);

    feeItems.forEach(item=>{
      y+=7;
      doc.text(String(item.sno),17,y);
      doc.text(item.month,80,y);
      doc.text(item.amount,195,y,{align:"right"});
    });

    y+=4;
    doc.line(15,y,195,y);

    y+=8;
    doc.setFont("helvetica","bold");
    doc.text("Total:",15,y);
    doc.text(`Rs. ${total.toLocaleString('en-IN',{minimumFractionDigits:2})}`,195,y,{align:"right"});

    y+=6;
    doc.setFontSize(8);
    doc.setFont("helvetica","normal");
    doc.text(`In Words: INR ${numberToWords(total)} Only`,15,y);

    y+=5;
    doc.text(`Transaction: ${transactionNo}`,15,y);

    y+=10;
    doc.setFont("helvetica","bold");
    doc.text("Authorized Signature",195,y,{align:"right"});
  }

  // Office Copy
  drawCopy(20);

  // Divider
  doc.setLineDashPattern([2,2],0);
  doc.line(10,148,200,148);
  doc.setLineDashPattern([],0);

  // Parent Copy
  drawCopy(160);

  doc.save(`Receipt_${studentData.name.replace(/\s+/g,'_')}.pdf`);
}

</script>

</body>
</html>
