<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Fee Receipt</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI;background:#eef2ff}
.container{max-width:800px;margin:30px auto;background:#fff;padding:25px;border-radius:12px}
input,button{width:100%;padding:12px;margin-top:10px}
button{background:#2563eb;color:#fff;border:none}
</style>
</head>

<body>

<div class="container">
<h2>School Fee Receipt</h2>

<input id="mobile" placeholder="Enter Mobile Number">
<button onclick="fetchStudent()">Fetch</button>

<div id="studentInfo"></div>
<div id="monthsBox"></div>
</div>

<script>

// FIREBASE
firebase.initializeApp({
  apiKey:"AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  databaseURL:"https://students-6e271-default-rtdb.firebaseio.com"
});

const db = firebase.database();
let studentData = {};

function fetchStudent(){
  const mobile = document.getElementById("mobile").value;

  db.ref(mobile).once("value",snap=>{
    if(!snap.exists()){
      alert("Not found");
      return;
    }

    studentData = snap.val();

    studentInfo.innerHTML = `
    <b>${studentData.name}</b><br>
    Class: ${studentData.class}`;

    showMonths();
  });
}

function showMonths(){
  let html = "";

  for(let m in studentData.fees){
    if(studentData.fees[m].status==="paid"){
      html += `
      <label>
        <input type="checkbox" value="${m}">
        ${m.toUpperCase()}
      </label><br>`;
    }
  }

  html += `<button onclick="generatePDF()">Generate Receipt</button>`;
  monthsBox.innerHTML = html;
}

// NUMBER TO WORDS
function numberToWords(num){
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

  if(num<20) return a[num];
  if(num<100) return b[Math.floor(num/10)]+" "+a[num%10];
  if(num<1000) return a[Math.floor(num/100)]+" Hundred "+numberToWords(num%100);

  return num;
}

// PDF
function generatePDF(){

  const selected = document.querySelectorAll("input:checked");
  if(selected.length === 0){
    alert("Select at least one month");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const receiptNo = "FR/" + Math.floor(Math.random()*100000);
  const today = new Date().toLocaleDateString();

  let total = 0;

  selected.forEach(cb=>{
    const m = cb.value;
    total += Number(studentData.fees[m].amount || studentData.monthlyfee);
  });

  const monthsText = Array.from(selected).map(cb=>cb.value.toUpperCase()).join(", ");

  // ========= FUNCTION TO DRAW ONE COPY =========
  function drawCopy(startY, title){

    let y = startY;

    // SCHOOL HEADER
    doc.setFont("helvetica","bold");
    doc.setFontSize(12);
    doc.text("SAI DRS KIDS SCHOOL",105,y,{align:"center"});

    y+=5;
    doc.setFontSize(9);
    doc.setFont("helvetica","normal");
    doc.text("R.G.B Road, Guwahati, Assam",105,y,{align:"center"});

    y+=6;

    // COPY TITLE
    doc.setFont("helvetica","bold");
    doc.text(title,15,y);

    doc.text("FEE RECEIPT (2025-26)",105,y,{align:"center"});

    y+=8;

    // RECEIPT INFO
    doc.setFont("helvetica","normal");
    doc.text(`Receipt No: ${receiptNo}`,15,y);
    doc.text(`Receipt Date: ${today}`,140,y);

    y+=8;

    // STUDENT DETAILS
    doc.text(`Student Name: ${studentData.name}`,15,y);
    doc.text(`Class: ${studentData.class}`,140,y);

    y+=7;
    doc.text(`Mobile: ${mobile.value}`,15,y);
    doc.text(`Roll No: ______`,140,y);

    y+=10;

    // TABLE HEADER
    doc.setFont("helvetica","bold");
    doc.text("S.No",15,y);
    doc.text("Particulars",30,y);
    doc.text("Month",100,y);
    doc.text("Amount",150,y);

    y+=3;
    doc.line(10,y,200,y);

    doc.setFont("helvetica","normal");

    let i = 1;

    selected.forEach(cb=>{
      const m = cb.value;
      const amt = Number(studentData.fees[m].amount || studentData.monthlyfee);

      y+=8;
      doc.text(String(i++),15,y);
      doc.text("Tuition Fee",30,y);
      doc.text(m.toUpperCase(),100,y);
      doc.text(String(amt),150,y);
    });

    y+=8;
    doc.line(10,y,200,y);

    y+=8;

    // TOTAL
    doc.setFont("helvetica","bold");
    doc.text(`Total Paid Amount: ₹ ${total}`,120,y);

    y+=8;

    // WORDS
    doc.setFont("helvetica","normal");
    doc.text(`Amount In Words: INR ${numberToWords(total)} Only`,15,y);

    y+=8;

    // PAYMENT DETAILS
    doc.text("Payment Mode: Cash / UPI / Online",15,y);
    doc.text("Transaction ID: ________",120,y);

    y+=12;

    // NOTE
    doc.setFontSize(8);
    doc.text("Note: Fees once paid will not be refunded.",15,y);

    y+=10;

    // SIGN
    doc.setFontSize(10);
    doc.text("Cashier/Manager",150,y);
  }

  // ===== DRAW BOTH COPIES =====
  drawCopy(15,"Office Copy");

  // Divider line
  doc.line(10,145,200,145);

  drawCopy(155,"Parent Copy");

  // SAVE
  doc.save(`Receipt_${studentData.name}_${receiptNo}.pdf`);
}
</script>

</body>
</html>
