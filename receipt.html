<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fee Book Receipt</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family:Segoe UI;
  background:#eef2ff;
}
.container{
  max-width:800px;
  margin:30px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
h2{
  text-align:center;
  color:#1e3a8a;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:#fff;
  font-weight:bold;
  border:none;
  transition:0.3s;
}
button:hover{
  transform:scale(1.05);
}
.month-box{
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:#f8fafc;
}
.month{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px dashed #ccc;
}
.generate{
  background:linear-gradient(135deg,#16a34a,#15803d);
}
</style>
</head>

<body>

<div class="container">
<h2>Fee Book Receipt Generator</h2>

<input id="mobile" placeholder="Enter Mobile Number">
<button onclick="fetchStudent()">Fetch Student</button>

<div id="studentInfo"></div>
<div id="monthsBox"></div>

</div>

<script>

// ================= FIREBASE =================
firebase.initializeApp({
  apiKey:"AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain:"students-6e271.firebaseapp.com",
  databaseURL:"https://students-6e271-default-rtdb.firebaseio.com",
  projectId:"students-6e271"
});

const db = firebase.database();

let studentData = {};
let mobileNo = "";

// ================= FETCH =================
function fetchStudent(){

  mobileNo = mobile.value.trim();

  if(!mobileNo){
    alert("Enter mobile number");
    return;
  }

  studentInfo.innerHTML = "Loading...";
  monthsBox.innerHTML = "";

  db.ref(mobileNo).once("value",snap=>{

    if(!snap.exists()){
      studentInfo.innerHTML = "❌ Student not found";
      return;
    }

    studentData = snap.val();

    studentInfo.innerHTML = `
      <b>Name:</b> ${studentData.name}<br>
      <b>Class:</b> ${studentData.class}
    `;

    showMonths();

  });
}

// ================= SHOW MONTHS =================
function showMonths(){

  let html = `<div class="month-box"><b>Select Paid Months</b>`;
  let found = false;

  for(let m in studentData.fees){

    if(studentData.fees[m].status === "paid"){

      const amt = Number(studentData.fees[m].amount || studentData.monthlyfee);
      found = true;

      html += `
      <div class="month">
        <label>
          <input type="checkbox" value="${m}">
          ${m.toUpperCase()}
        </label>
        ₹${amt}
      </div>`;
    }
  }

  if(!found){
    html += `<p style="color:red">No paid months found</p>`;
  } else {
    html += `<button class="generate" onclick="generatePDF()">Generate Receipt</button>`;
  }

  html += `</div>`;
  monthsBox.innerHTML = html;
}

// ================= NUMBER TO WORDS =================
function numberToWords(num){

  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];

  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

  if(num < 20) return a[num];
  if(num < 100) return b[Math.floor(num/10)] + " " + a[num%10];
  if(num < 1000) return a[Math.floor(num/100)] + " Hundred " + numberToWords(num%100);

  return num;
}

// ================= PDF GENERATION =================
function generatePDF(){

  const selected = document.querySelectorAll("input:checked");

  if(selected.length === 0){
    alert("Select at least one month");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  const receiptNo = "R-" + Date.now();

  // ===== BORDER =====
  doc.rect(10,10,190,277);

  // ===== HEADER =====
  doc.setFont("helvetica","bold");
  doc.setFontSize(14);
  doc.text("FEE BOOK",105,y,{align:"center"});

  y+=8;
  doc.setFontSize(18);
  doc.text("SAI DRS KIDS",105,y,{align:"center"});

  y+=6;
  doc.setFontSize(10);
  doc.setFont("helvetica","normal");
  doc.text("(A Unit of Saai Scholar's Society)",105,y,{align:"center"});

  y+=5;
  doc.text("R.G.B Road, Junali, Guwahati - 781024",105,y,{align:"center"});

  y+=5;
  doc.text("Ph: 7980981949",105,y,{align:"center"});

  // Date
  doc.text(`Date: ${new Date().toLocaleDateString()}`,150,20);

  y+=15;

  // ===== STUDENT INFO =====
  doc.text(`Student Name: ${studentData.name}`,15,y);
  y+=10;

  doc.text(`Class: ${studentData.class}`,15,y);
  doc.text(`Roll No: ______`,110,y);

  y+=12;

  // ===== FEES =====
  doc.text("Admission Fees: ____________",15,y); y+=10;
  doc.text("Creche Fees: ____________",15,y); y+=10;
  doc.text("Others: Tuition Fee",15,y);

  // ===== RIGHT AMOUNT BOX =====
  doc.rect(140,80,50,90);

  doc.setFont("helvetica","bold");
  doc.text("Rs.",150,85);
  doc.text("P.",180,85);

  let total = 0;

  selected.forEach(cb=>{
    const m = cb.value;
    total += Number(studentData.fees[m].amount || studentData.monthlyfee);
  });

  doc.text(String(total),150,110);

  doc.setFont("helvetica","normal");

  y+=20;

  // ===== MONTH =====
  let monthsText = Array.from(selected).map(cb=>cb.value.toUpperCase()).join(", ");
  doc.text(`For the month of: ${monthsText}`,15,y);

  y+=15;

  // ===== TOTAL =====
  doc.text("Total:",140,y);
  doc.text(String(total),170,y);

  y+=15;

  // ===== AMOUNT IN WORDS =====
  doc.text("Amount in words:",15,y);
  y+=8;

  doc.text(numberToWords(total) + " only",15,y);

  // ===== SIGNATURE =====
  doc.line(130,260,190,260);
  doc.text("Signature",150,268);

  // ===== SAVE =====
  doc.save(`FeeBook_${studentData.name}_${receiptNo}.pdf`);
}

</script>

</body>
</html>
