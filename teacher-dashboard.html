<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

/* Header */
.header {
    background: #2e7d32;
    color: #fff;
    padding: 15px;
    font-size: 20px;
    text-align: center;
}

/* Welcome */
.welcome {
    padding: 15px;
    text-align: center;
    font-size: 18px;
    color: #333;
}

/* Dashboard grid */
.dashboard {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* Cards */
.card {
    background: #fff;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    margin: 0;
    color: #333;
}

.card p {
    color: #777;
    font-size: 14px;
}

/* Logout */
.logout {
    text-align: center;
    margin: 20px;
}

.logout button {
    padding: 10px 20px;
    background: #c62828;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- 🔐 AUTH PROTECTION -->
<script>
if (
  localStorage.getItem("isLoggedIn") !== "true" ||
  localStorage.getItem("erpRole") !== "teacher"
) {
  window.location.href = "login.html";
}
</script>

<div class="header">Teacher Dashboard</div>

<div class="welcome">
    Welcome, <strong><span id="teacherName">Teacher</span></strong>
</div>

<div class="dashboard">
    <div class="card" onclick="location.href='attendance.html'">
        <h3>Attendance</h3>
        <p>Mark student attendance</p>
    </div>

    <div class="card" onclick="location.href='homework.html'">
        <h3>Homework</h3>
        <p>Send homework to students</p>
    </div>

    <div class="card" onclick="location.href='notifications.html'">
        <h3>Notifications</h3>
        <p>Send notices & updates</p>
    </div>
</div>

<div class="logout">
    <button onclick="logout()">Logout</button>
</div>

<script>
/* Show teacher name */
document.getElementById("teacherName").innerText =
  localStorage.getItem("teacherName") || "Teacher";

/* Logout */
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
