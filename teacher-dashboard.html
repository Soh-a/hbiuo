<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

/* Header */
.header {
    background: #2e7d32;
    color: #fff;
    padding: 15px;
    font-size: 20px;
    text-align: center;
}

/* Welcome */
.welcome {
    padding: 15px;
    text-align: center;
    font-size: 18px;
    color: #333;
}

/* Dashboard grid */
.dashboard {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* Cards */
.card {
    background: #fff;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.3s;
}
.card:hover { transform: translateY(-5px); }

.logout {
    text-align: center;
    margin: 20px;
}
.logout button {
    padding: 10px 20px;
    background: #c62828;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* AI Button */
.ai-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: #2e7d32;
    color: #fff;
    border-radius: 50%;
    font-size: 22px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

/* AI Box */
.ai-box {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 320px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    display: none;
    flex-direction: column;
}

.ai-header {
    background: #2e7d32;
    color: #fff;
    padding: 10px;
    text-align: center;
}

.ai-messages {
    padding: 10px;
    height: 230px;
    overflow-y: auto;
    font-size: 14px;
}

.ai-input {
    display: flex;
    border-top: 1px solid #ddd;
}
.ai-input input {
    flex: 1;
    padding: 8px;
    border: none;
    outline: none;
}
.ai-input button {
    padding: 8px 12px;
    background: #2e7d32;
    color: #fff;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- AUTH CHECK -->
<script>
if (
  localStorage.getItem("isLoggedIn") !== "true" ||
  localStorage.getItem("erpRole") !== "teacher"
) {
  window.location.href = "login.html";
}
</script>

<div class="header">Teacher Dashboard</div>

<div class="welcome">
  Welcome, <b><span id="teacherName">Teacher</span></b>
</div>

<div class="dashboard">
  <div class="card" onclick="location.href='attendance.html'">
    <h3>Attendance</h3>
    <p>Mark student attendance</p>
  </div>
  <div class="card" onclick="location.href='logbook.html'">
    <h3>Daily Class Record</h3>
    <p>Maintain logbook</p>
  </div>
  <div class="card" onclick="location.href='Notification.html'">
    <h3>Notifications</h3>
    <p>Send notices</p>
  </div>
</div>

<div class="logout">
  <button onclick="logout()">Logout</button>
</div>

<!-- AI -->
<button class="ai-btn" onclick="toggleAI()">AI</button>

<div class="ai-box" id="aiBox">
  <div class="ai-header">AI Assistant</div>
  <div class="ai-messages" id="aiMessages">
    <div><b>AI:</b> Hello Teacher! Ask me anything 😊</div>
  </div>
  <div class="ai-input">
    <input type="text" id="aiInput" placeholder="Type here...">
    <button onclick="sendAI()">Send</button>
  </div>
</div>

<script>
document.getElementById("teacherName").innerText =
  localStorage.getItem("teacherName") || "Teacher";

function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}

function toggleAI(){
  const box = document.getElementById("aiBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

/* ================= AI LOGIC ================= */

function sendAI(){
  const input = document.getElementById("aiInput");
  const msgBox = document.getElementById("aiMessages");
  const question = input.value.trim();
  if(!question) return;

  msgBox.innerHTML += `<div><b>You:</b> ${question}</div>`;

  let answer = getAIAnswer(question);

  msgBox.innerHTML += `<div><b>AI:</b> ${answer}</div>`;
  input.value = "";
  msgBox.scrollTop = msgBox.scrollHeight;
}

/* SMART AI FUNCTION */
function getAIAnswer(q){
  q = q.toLowerCase();

  /* MATH DETECTION */
  if (/^[0-9+\-*/ ().]+$/.test(q)) {
    try {
      let result = Function("return " + q)();
      return `The answer is <b>${result}</b>`;
    } catch {
      return "I could not understand the calculation.";
    }
  }

  /* COMMON QUESTIONS */
  if(q.includes("hello")) return "Hello 😊";
  if(q.includes("1+1")) return "1 + 1 = 2";
  if(q.includes("principal")) return "The principal of Sai DRS Kids is Mousumi Sarmah.";
  if(q.includes("attendance")) return "You can mark attendance from the Attendance section.";
  if(q.includes("fee")) return "Fees are handled by the office staff.";

  return "I am here to help with school-related questions and basic maths.";
}
</script>

</body>
</html>
