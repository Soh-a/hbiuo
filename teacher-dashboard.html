<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Base styling */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #e0f0ff; /* Light blue background */
}

/* Header */
.header {
    background: linear-gradient(90deg, #0077b6, #90e0ef); /* Blue gradient */
    color: #ffd60a; /* Golden text */
    padding: 18px;
    font-size: 22px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Welcome text */
.welcome {
    text-align: center;
    padding: 18px;
    font-size: 18px;
    color: #023e8a; /* Dark blue text */
}

/* Dashboard grid */
.dashboard {
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

/* Card styling */
.card {
    background: #ffffff;
    border-radius: 14px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.12);
    cursor: pointer;
    font-weight: 600;
    font-size: 17px;
    color: #023e8a;
    transition: all 0.3s ease;
    border-top: 4px solid #ffd60a; /* golden accent */
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    background: #caf0f8; /* light blue hover */
}

/* Logout button */
.logout {
    text-align: center;
    margin: 25px;
}

.logout button {
    background: #0077b6;
    color: #ffd60a;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.logout button:hover {
    background: #023e8a;
    color: #ffe066;
}
</style>
</head>

<body>

<!-- 🔐 AUTH GUARD -->
<script>
if(
  localStorage.getItem("isLoggedIn")!=="true" ||
  localStorage.getItem("erpRole")!=="teacher"
){
  window.location.href="login.html";
}
</script>

<div class="header">Teacher Dashboard</div>

<div class="welcome">
  Welcome, <b><span id="teacherName">Teacher</span></b>
</div>

<div class="dashboard">
  <div class="card" onclick="location.href='attendance.html'">Attendance</div>
  <div class="card" onclick="location.href='logbook.html'">Daily Class Record</div>
  <div class="card" onclick="location.href='Notification.html'">Notifications</div>
  <div class="card" onclick="location.href='gradebook.html'">Grade Book</div> <!-- New Card -->
  <div class="card" onclick="location.href='details.html'">Details</div>
 <div class="card" onclick="location.href='Exm.html'">exam mangement</div>
</div>

<div class="logout">
  <button onclick="logout()">Logout</button>
</div>

<script>
/* Show teacher name */
document.getElementById("teacherName").innerText =
  localStorage.getItem("teacherName") || "Teacher";

/* Logout */
function logout(){
  localStorage.clear();
  window.location.href="login.html";
}
</script>

</body>
</html>
