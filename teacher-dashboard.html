<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

/* Header */
.header {
    background: #2e7d32;
    color: #fff;
    padding: 15px;
    font-size: 20px;
    text-align: center;
}

/* Welcome */
.welcome {
    padding: 15px;
    text-align: center;
    font-size: 18px;
    color: #333;
}

/* Dashboard */
.dashboard {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.3s;
}
.card:hover { transform: translateY(-5px); }

.logout {
    text-align: center;
    margin: 20px;
}
.logout button {
    padding: 10px 20px;
    background: #c62828;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* AI Floating Button */
.ai-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: #2e7d32;
    color: #fff;
    border-radius: 50%;
    font-size: 22px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    z-index: 1000;
}

/* AI Chat Box */
.ai-box {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 320px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
}

.ai-header {
    background: #2e7d32;
    color: #fff;
    padding: 10px;
    text-align: center;
}

.ai-messages {
    padding: 10px;
    height: 240px;
    overflow-y: auto;
    font-size: 14px;
}

.ai-input {
    display: flex;
    border-top: 1px solid #ddd;
}
.ai-input input {
    flex: 1;
    padding: 8px;
    border: none;
    outline: none;
}
.ai-input button {
    padding: 8px 14px;
    background: #2e7d32;
    color: #fff;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<script>
if (
  localStorage.getItem("isLoggedIn") !== "true" ||
  localStorage.getItem("erpRole") !== "teacher"
) {
  window.location.href = "login.html";
}
</script>

<div class="header">Teacher Dashboard</div>

<div class="welcome">
  Welcome, <strong><span id="teacherName">Teacher</span></strong>
</div>

<div class="dashboard">
  <div class="card" onclick="location.href='attendance.html'">
    <h3>Attendance</h3>
    <p>Mark student attendance</p>
  </div>

  <div class="card" onclick="location.href='logbook.html'">
    <h3>Daily Class Record</h3>
    <p>Maintain class logbook</p>
  </div>

  <div class="card" onclick="location.href='Notification.html'">
    <h3>Notifications</h3>
    <p>Send notices & updates</p>
  </div>
</div>

<div class="logout">
  <button onclick="logout()">Logout</button>
</div>

<!-- AI Button -->
<button class="ai-btn" onclick="toggleAI()">AI</button>

<!-- AI Chat -->
<div class="ai-box" id="aiBox">
  <div class="ai-header">AI Assistant</div>
  <div class="ai-messages" id="aiMessages">
    <div><b>AI:</b> Hello Teacher! Ask me anything.</div>
  </div>
  <div class="ai-input">
    <input type="text" id="aiInput" placeholder="Type your question...">
    <button onclick="sendAI()">Send</button>
  </div>
</div>

<script>
document.getElementById("teacherName").innerText =
  localStorage.getItem("teacherName") || "Teacher";

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

function toggleAI() {
  const box = document.getElementById("aiBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

/* ================= REAL AI CONFIG ================= */
const AI_API_KEY = "AIzaSyDc2LT4VfCMj9g3tHtXLoOusToDpgUvhTo";

async function sendAI() {
  const input = document.getElementById("aiInput");
  const messages = document.getElementById("aiMessages");
  const question = input.value.trim();
  if (!question) return;

  messages.innerHTML += `<div><b>You:</b> ${question}</div>`;
  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  messages.innerHTML += `<div><b>AI:</b> Thinking...</div>`;
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${AI_API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: question }] }]
        })
      }
    );

    const data = await res.json();
    const answer =
      data.candidates?.[0]?.content?.parts?.[0]?.text ||
      "Sorry, I couldn't understand that.";

    messages.lastElementChild.innerHTML = `<b>AI:</b> ${answer}`;
    messages.scrollTop = messages.scrollHeight;

  } catch (err) {
    messages.lastElementChild.innerHTML =
      "<b>AI:</b> Error connecting to AI service.";
  }
}
</script>

</body>
</html>
