<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.header {
    background: #2e7d32;
    color: #fff;
    padding: 15px;
    font-size: 20px;
    text-align: center;
}

.dashboard {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    margin: 0;
    color: #333;
}

.card p {
    color: #777;
    font-size: 14px;
}

.notice {
    margin: 30px;
    padding: 20px;
    background: #fff3cd;
    color: #856404;
    border-radius: 10px;
    text-align: center;
}

.btn {
    margin-top: 15px;
    padding: 10px 18px;
    border: none;
    background: #2e7d32;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">Teacher Dashboard</div>

<!-- Show this notice if no class uploaded -->
<div class="notice">
    <h3>No Classes Found</h3>
    <p>Please first upload your classes to mark attendance.</p>
    <button class="btn" onclick="location.href='add-class.html'">
        ➕ Add Class
    </button>
</div>

<div class="dashboard">
    <div class="card" onclick="location.href='attendance.html'">
        <h3>Attendance</h3>
        <p>Mark student attendance</p>
    </div>

    <div class="dashboard">
    <div class="card" onclick="location.href='homework.html'">
        <h3>Homework</h3>
        <p>Send homework to students</p>
    </div>

    <div class="card">
        <h3>Notifications</h3>
        <p>Send notices & updates</p>
    </div>
</div>

</body>
</html>
