<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Excel + PDF -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#4facfe,#00f2fe);
}

.header {
  padding: 20px;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

.container {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
  gap: 10px;
}

select, input, button {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  background: #4facfe;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover { opacity: 0.9; }

.card {
  background: #f9f9f9;
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  border-left: 5px solid #4facfe;
}

.title { font-weight: bold; margin-bottom: 5px; }

.empty {
  text-align: center;
  margin-top: 20px;
  color: gray;
}
</style>
</head>
<body>

<div class="header">📊 Teacher Dashboard</div>

<div class="container">

<div class="controls">
<select id="classSelect">
<option value="">Select Class</option>
<option value="IK-1">IK-1</option>
<option value="IK-2">IK-2</option>
<option value="IK-3">IK-3</option>
<option value="Class 1">Class 1</option>
<option value="Class 2">Class 2</option>
<option value="Class 3">Class 3</option>
<option value="Class 4">Class 4</option>
<option value="Class 5">Class 5</option>
</select>

<select id="viewType">
<option value="">Select View</option>
<option value="logbook">Logbook</option>
<option value="attendance">Attendance</option>
</select>

<input type="date" id="fromDate">
<input type="date" id="toDate">

<button id="loadBtn">Load</button>
<button onclick="downloadExcel()">Excel</button>
<button onclick="downloadPDF()">PDF</button>
</div>

<div id="dataContainer"></div>

</div>

<script>
let db;
let currentData = [];

const firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
db = firebase.database();

document.getElementById("loadBtn").addEventListener("click", loadData);

async function loadData() {
  const cls = document.getElementById("classSelect").value;
  const type = document.getElementById("viewType").value;
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;

  const container = document.getElementById("dataContainer");

  if (!cls || !type) {
    container.innerHTML = '<div class="empty">Select class & view</div>';
    return;
  }

  container.innerHTML = "Loading...";
  currentData = [];

  try {

    if (type === "logbook") {
      const snap = await db.ref("logbook/" + cls).once("value");
      const data = snap.val() || {};

      container.innerHTML = "";

      Object.keys(data).forEach(date => {
        if (from && date < from) return;
        if (to && date > to) return;

        const log = data[date];

        currentData.push({ date, ...log });

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="title">📅 ${date}</div>
          👩‍🏫 ${log.teacher || ''}<br>
          📘 ${log.subject || ''} - ${log.topic || ''}<br>
          📝 ${log.homework || ''}
        `;
        container.appendChild(div);
      });
    }

    if (type === "attendance") {
      const snap = await db.ref("attendance").once("value");
      const data = snap.val() || {};

      container.innerHTML = "";

      Object.values(data).forEach(section => {
        Object.keys(section).forEach(date => {

          if (from && date < from) return;
          if (to && date > to) return;

          let present = 0;
          let absent = 0;

          Object.values(section[date]).forEach(student => {
            if (student.class === cls) {
              if (student.status === "Present") present++;
              if (student.status === "Absent") absent++;
            }
          });

          if (present === 0 && absent === 0) return;

          currentData.push({ date, present, absent });

          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <div class="title">📅 ${date}</div>
            ✅ Present: ${present}<br>
            ❌ Absent: ${absent}
          `;
          container.appendChild(div);
        });
      });
    }

    if (currentData.length === 0) {
      container.innerHTML = '<div class="empty">No data found</div>';
    }

  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="empty">Error loading data</div>';
  }
}

function downloadExcel() {
  if (!currentData.length) return alert("No data");
  const ws = XLSX.utils.json_to_sheet(currentData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Report");
  XLSX.writeFile(wb, "Report.xlsx");
}

function downloadPDF() {
  if (!currentData.length) return alert("No data");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 10;

  currentData.forEach(item => {
    doc.text(JSON.stringify(item), 10, y);
    y += 10;
  });

  doc.save("Report.pdf");
}
</script>

</body>
</html>
