<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Viewer</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; margin:0; }
header { background:#2c3e50; color:white; padding:15px; text-align:center; }
.container { padding:20px; }
select, input, button { padding:10px; margin:5px; }
.card { background:white; padding:15px; margin-top:10px; border-radius:10px; }
</style>
</head>
<body>

<header><h2>Teacher Logbook / Attendance</h2></header>

<div class="container">

<select id="classSelect">
<option value="">Select Class</option>
<option value="IK-1">IK-1</option>
<option value="IK-2">IK-2</option>
<option value="IK-3">IK-3</option>
<option value="Class 1">Class 1</option>
<option value="Class 2">Class 2</option>
<option value="Class 3">Class 3</option>
<option value="Class 4">Class 4</option>
<option value="Class 5">Class 5</option>
</select>

<select id="viewType">
<option value="">Select View</option>
<option value="logbook">Logbook</option>
<option value="attendance">Attendance</option>
</select>

<input type="date" id="fromDate">
<input type="date" id="toDate">

<button id="loadBtn">Load</button>
<button onclick="downloadExcel()">Excel</button>
<button onclick="downloadPDF()">PDF</button>

<div id="dataContainer"></div>
</div>

<script>
let db;
let currentData = [];

const firebaseConfig = {
 apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
 databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
};

firebase.initializeApp(firebaseConfig);
db = firebase.database();

// ✅ attach event safely (fix loadData undefined)
document.getElementById("loadBtn").addEventListener("click", loadData);

async function loadData() {
  const cls = document.getElementById("classSelect").value;
  const type = document.getElementById("viewType").value;
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;

  const container = document.getElementById("dataContainer");

  if (!cls || !type) {
    container.innerHTML = "Please select class & view type";
    return;
  }

  container.innerHTML = "Loading...";
  currentData = [];

  try {

    if (type === "logbook") {
      const snap = await db.ref("logbook/" + cls).once("value");
      const data = snap.val() || {};

      container.innerHTML = "";

      Object.keys(data).forEach(date => {

        if (from && date < from) return;
        if (to && date > to) return;

        const log = data[date];

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = "<b>" + date + "</b><br>" +
                        "👩‍🏫 " + (log.teacher || "") + "<br>" +
                        "📘 " + (log.subject || "") + " - " + (log.topic || "") + "<br>" +
                        "📝 HW: " + (log.homework || "");

        currentData.push({ date: date, teacher: log.teacher });
        container.appendChild(div);
      });
    }

    if (type === "attendance") {
      const snap = await db.ref("attendance").once("value");
      const data = snap.val() || {};

      container.innerHTML = "";

      Object.entries(data).forEach(function(entry) {
        const section = entry[1];

        Object.keys(section).forEach(date => {

          if (from && date < from) return;
          if (to && date > to) return;

          let present = 0;
          let absent = 0;
          let matched = false;

          Object.values(section[date]).forEach(student => {
            if (student.class === cls) {
              matched = true;
              if (student.status === "Present") present++;
              if (student.status === "Absent") absent++;
            }
          });

          if (!matched) return;

          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = "<b>" + date + "</b><br>" +
                          "✅ Present: " + present + "<br>" +
                          "❌ Absent: " + absent;

          currentData.push({ date: date, present: present, absent: absent });
          container.appendChild(div);
        });
      });
    }

    if (currentData.length === 0) {
      container.innerHTML = "No data found";
    }

  } catch (err) {
    console.error(err);
    container.innerHTML = "Error loading data";
  }
}

function downloadExcel() {
  if (currentData.length === 0) return alert("No data");
  const ws = XLSX.utils.json_to_sheet(currentData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Report");
  XLSX.writeFile(wb, "Report.xlsx");
}

async function downloadPDF() {
  if (currentData.length === 0) return alert("No data");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 10;

  currentData.forEach(item => {
    doc.text(JSON.stringify(item), 10, y);
    y += 10;
  });

  doc.save("Report.pdf");
}
</script>

</body>
</html>
