<!DOCTYPE html>
<html>
<head>
  <title>Send WhatsApp Message</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 30px; color: #333; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    input, textarea, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { background: #25D366; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background: #1ebe5d; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

<h2>Send WhatsApp Message</h2>

<div class="container">

  <label>Select Student</label>
  <select id="studentSelect">
    <option value="">-- Select Student --</option>
    <option value="ALL">📢 Select All Students</option>
  </select>

  <label>Message</label>
  <textarea id="message" rows="4" placeholder="Type your message here..."></textarea>

  <button onclick="sendWhatsApp()">Send via WhatsApp</button>
  <p id="status"></p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const studentSelect = document.getElementById("studentSelect");
const messageInput = document.getElementById("message");
const status = document.getElementById("status");

let students = {};

// Load students
onValue(ref(db, "/"), (snapshot) => {
  const data = snapshot.val();
  students = data || {};
  for (let id in students) {
    studentSelect.innerHTML += `<option value="${id}">${students[id].name}</option>`;
  }
});

// WhatsApp send
window.sendWhatsApp = function () {
  const selected = studentSelect.value;
  const msg = messageInput.value.trim();

  if (!selected) {
    status.textContent = "Please select a student or ALL.";
    status.style.color = "red";
    return;
  }

  if (!msg) {
    status.textContent = "Message cannot be empty.";
    status.style.color = "red";
    return;
  }

  let finalMessage = "";

  if (selected === "ALL") {
    finalMessage = "📢 Message for All Students:\n\n";
    Object.values(students).forEach(s => {
      finalMessage += `• ${s.name}\n`;
    });
    finalMessage += `\n${msg}`;
  } else {
    finalMessage = `👦 Student: ${students[selected].name}\n\n${msg}`;
  }

  const whatsappNumber = "6002425951"; // FIXED NUMBER
  const url = `https://wa.me/91${whatsappNumber}?text=${encodeURIComponent(finalMessage)}`;
  window.open(url, "_blank");

  status.textContent = "WhatsApp opened. Click Send.";
  status.style.color = "green";
};
</script>

</body>
</html>
