<!DOCTYPE html>
<html>
<head>
  <title>Monthly Fee Summary</title>
  <style>
    /* General body styling */
    body { 
      font-family: Arial, sans-serif; 
      margin: 40px; 
      background: #f5f5f5; 
    }

    /* Heading */
    h2 { 
      text-align: center; 
      margin-bottom: 30px; 
      color: #333;
    }

    /* Summary box */
    .summary { 
      text-align: center; 
      font-size: 20px; 
      background: #fff; 
      padding: 20px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 400px; 
      margin: 0 auto; 
    }

    .summary p { 
      margin: 15px 0; 
    }

    .summary b { 
      color: #4CAF50; 
      font-size: 22px;
    }
  </style>
</head>
<body>

<h2>Monthly Fee Summary</h2>
<div class="summary">
  <p>Total Fee Collected: <b id="collected">₹0</b></p>
  <p>Total Fee To Be Collected: <b id="toCollect">₹0</b></p>
</div>

<!-- Link to separate JS file -->
<script type="module" src="summary.js"></script>
</body>
</html>
