<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fee Status – Sai DRS Kids</title>

<!-- Firebase -->
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/fees.js"></script>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --bg:#f1f5f9;
  --card:#ffffff;
}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{
  margin:0;
  background:var(--bg);
  padding:30px;
}
h2{
  color:#1e293b;
  margin-bottom:20px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:25px;
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.card h4{margin:0;color:#64748b;font-weight:500}
.card b{font-size:26px}
.paid{color:var(--success)}
.unpaid{color:var(--danger)}

/* TABLE */
.table-wrap{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:#f8fafc;
  color:#475569;
  padding:14px;
  text-align:left;
}
td{
  padding:14px;
  border-bottom:1px solid #e5e7eb;
}
.status-paid{
  color:var(--success);
  font-weight:600;
}
.status-unpaid{
  color:var(--danger);
  font-weight:600;
}
.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}
.badge-paid{background:#dcfce7;color:#166534}
.badge-unpaid{background:#fee2e2;color:#991b1b}
</style>
</head>

<body>

<h2>💰 Fee Status</h2>

<div class="cards">
  <div class="card">
    <h4>Total Paid</h4>
    <b class="paid" id="paid">₹0</b>
  </div>
  <div class="card">
    <h4>Total Unpaid</h4>
    <b class="unpaid" id="unpaid">₹0</b>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Month</th>
        <th>Status</th>
        <th>Fine</th>
        <th>Payment ID</th>
        <th>Paid Date</th>
      </tr>
    </thead>
    <tbody id="feeBody"></tbody>
  </table>
</div>

</body>
</html>
