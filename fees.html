<!DOCTYPE html>
<html>
<head>
  <title>Student Fees</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f5f5f5; }
    h2 { text-align: center; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #4CAF50; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: #e6f7e6; }
    .summary { text-align: center; margin-top: 20px; font-size: 18px; }
    .summary b { color: #4CAF50; }
  </style>
</head>
<body>

<h2>Student Fee Details</h2>

<table id="feesTable">
  <thead>
    <tr>
      <th>Student ID</th>
      <th>Name</th>
      <th>Month</th>
      <th>Status</th>
      <th>Fine</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="summary">
  <p>Total Fee Collected: <b id="collected">₹0</b></p>
  <p>Total Fee To Be Collected: <b id="toCollect">₹0</b></p>
</div>

<script type="module" src="fees.js"></script>
</body>
</html>
