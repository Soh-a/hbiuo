<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send Notification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}
.header{
    background:#2e7d32;
    color:#fff;
    padding:15px;
    font-size:20px;
    text-align:center;
}
.container{
    padding:20px;
}
.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}
select, input, textarea, button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}
textarea{
    resize:none;
    height:120px;
}
button{
    margin-top:20px;
    background:#2e7d32;
    color:white;
    border:none;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#256528;
}
.success{
    color:green;
    margin-top:15px;
    text-align:center;
}
.error{
    color:red;
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">Send Notification</div>

<div class="container">
    <div class="card">

        <label>Select Class</label>
        <select id="classSelect">
            <option value="">-- Select Class --</option>
            <option>IK-1</option>
            <option>IK-2</option>
            <option>IK-3</option>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
            <option>Class 4</option>
        </select>

        <label>Notification Title</label>
        <input type="text" id="title" placeholder="Eg: Holiday Notice">

        <label>Message</label>
        <textarea id="message" placeholder="Write notification message..."></textarea>

        <button onclick="sendNotification()">Send Notification</button>

        <div id="status"></div>

    </div>
</div>

<script>
/* FIREBASE INIT */
firebase.initializeApp({
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
});

const db = firebase.database();

/* AUTH CHECK (TEACHER ONLY) */
if(localStorage.getItem("erpRole") !== "teacher"){
    window.location.href = "login.html";
}

/* SEND NOTIFICATION */
function sendNotification(){
    const cls = document.getElementById("classSelect").value;
    const title = document.getElementById("title").value.trim();
    const message = document.getElementById("message").value.trim();
    const status = document.getElementById("status");

    status.innerHTML = "";

    if(!cls || !title || !message){
        status.innerHTML = "<p class='error'>All fields are required</p>";
        return;
    }

    const now = new Date();
    const date = now.toISOString().split("T")[0];
    const time = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const teacherId = localStorage.getItem("teacherId") || "unknown";

    /* IMPORTANT FIX: push() */
    db.ref(`notifications/${cls}`).push({
        title: title,
        message: message,
        date: date,
        time: time,
        teacherId: teacherId,
        timestamp: Date.now()
    })
    .then(()=>{
        status.innerHTML = "<p class='success'>Notification sent successfully ✅</p>";
        document.getElementById("title").value = "";
        document.getElementById("message").value = "";
    })
    .catch(err=>{
        status.innerHTML = "<p class='error'>Error sending notification ❌</p>";
        console.error(err);
    });
}
</script>

</body>
</html>
