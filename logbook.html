<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Log Book – Sai DRS Kids</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

/* HEADER */
.header{
    background:#2e7d32;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

/* WELCOME */
.welcome{
    padding:15px;
    background:#e8f5e9;
    font-size:16px;
}

/* FORM */
.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h3{
    margin-top:0;
    color:#2e7d32;
}

label{
    font-weight:bold;
    font-size:14px;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

textarea{
    min-height:70px;
    resize:vertical;
}

button{
    width:100%;
    padding:12px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#256a2b;
}
</style>
</head>

<body>

<div class="header">Daily Class Log Book</div>

<div class="welcome">
    Welcome, <strong id="teacherName"></strong>
</div>

<div class="container">
<div class="card">

<h3>📘 Class Record Entry</h3>

<label>Class</label>
<select id="className">
    <option value="">Select Class</option>
    <option>Playgroup</option>
    <option>IK-1</option>
    <option>IK-2</option>
    <option>IK-3</option>
    <option>Class 1</option>
    <option>Class 2</option>
    <option>Class 3</option>
    <option>Class 4</option>
    <option>Class 5</option>
</select>

<label>Date</label>
<input type="date" id="logDate">

<label>Subject</label>
<input type="text" id="subject" placeholder="Eg: English">

<label>Topic Covered</label>
<textarea id="topic" placeholder="Lesson / topic taught today"></textarea>

<label>Class Activities</label>
<textarea id="activities" placeholder="Activities conducted"></textarea>

<label>Homework Given</label>
<textarea id="homework" placeholder="Homework details"></textarea>

<button onclick="saveLog()">Save Log Book</button>

</div>
</div>

<script>
/* ---------------- FIREBASE CONFIG ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271",
  storageBucket: "students-6e271.firebasestorage.app",
  messagingSenderId: "336382170224",
  appId: "1:336382170224:web:21b2ace0bb69d5459810b5"
};
firebase.initializeApp(firebaseConfig);

/* ---------------- LOGIN SESSION ---------------- */
const teacher = localStorage.getItem("teacherName");
if(!teacher){
    alert("Please login again");
    window.location.href="login.html";
}
document.getElementById("teacherName").innerText = teacher;

/* ---------------- AUTO DATE ---------------- */
document.getElementById("logDate").value =
    new Date().toISOString().split("T")[0];

/* ---------------- SAVE LOG ---------------- */
function saveLog(){
    const className = document.getElementById("className").value;
    const date = document.getElementById("logDate").value;
    const subject = document.getElementById("subject").value;
    const topic = document.getElementById("topic").value;
    const activities = document.getElementById("activities").value;
    const homework = document.getElementById("homework").value;

    if(!className || !subject){
        alert("Class and Subject are required");
        return;
    }

    firebase.database().ref(`logbook/${className}/${date}`).set({
        teacher: teacher,
        subject: subject,
        topic: topic,
        activities: activities,
        homework: homework,
        createdAt: Date.now()
    }).then(()=>{
        alert("Log Book Saved Successfully ✅");
        document.getElementById("subject").value="";
        document.getElementById("topic").value="";
        document.getElementById("activities").value="";
        document.getElementById("homework").value="";
    });
}
</script>

</body>
</html>
