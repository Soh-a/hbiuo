<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Log Book – Sai DRS Kids</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#dff6e4,#f4f7ff);
    min-height:100vh;
    overflow-x:hidden;
}

/* Animated Background */

.bg-circle{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.4;
    z-index:-1;
    animation:float 8s infinite ease-in-out;
}

.circle1{
    width:300px;
    height:300px;
    background:#66bb6a;
    top:-80px;
    left:-80px;
}

.circle2{
    width:350px;
    height:350px;
    background:#42a5f5;
    bottom:-100px;
    right:-100px;
    animation-delay:2s;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(25px);}
    100%{transform:translateY(0px);}
}

/* Header */

.header{
    width:100%;
    padding:22px;
    background:rgba(46,125,50,0.9);
    backdrop-filter:blur(10px);
    color:white;
    text-align:center;
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    animation:slideDown 1s ease;
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Welcome */

.welcome{
    width:92%;
    max-width:850px;
    margin:25px auto 0;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(12px);
    padding:18px;
    border-radius:18px;
    font-size:16px;
    color:#1b5e20;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    animation:fadeUp 1s ease;
}

.welcome strong{
    color:#2e7d32;
}

/* Main Container */

.container{
    width:92%;
    max-width:850px;
    margin:25px auto;
    animation:fadeUp 1.2s ease;
}

/* Card */

.card{
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(14px);
    border-radius:28px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,0.12);
    border:1px solid rgba(255,255,255,0.4);
}

/* Title */

.card h3{
    font-size:28px;
    color:#2e7d32;
    margin-bottom:25px;
    text-align:center;
}

/* Inputs */

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#2e7d32;
}

input,
select,
textarea{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:14px;
    background:rgba(255,255,255,0.9);
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.05);
    font-size:14px;
    transition:0.3s;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    transform:scale(1.01);
    box-shadow:0 0 0 4px rgba(46,125,50,0.15);
}

/* Button */

button{
    width:100%;
    margin-top:28px;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#2e7d32,#43a047);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    overflow:hidden;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(46,125,50,0.3);
}

button:active{
    transform:scale(0.98);
}

/* Success Popup */

.popup{
    position:fixed;
    top:30px;
    right:30px;
    background:#2e7d32;
    color:white;
    padding:18px 24px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    font-size:15px;
    z-index:999;
    opacity:0;
    transform:translateX(120px);
    pointer-events:none;
    transition:0.5s;
}

.popup.show{
    opacity:1;
    transform:translateX(0);
}

/* Fade Animation */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Mobile */

@media(max-width:600px){

    .header{
        font-size:20px;
        padding:18px;
    }

    .card{
        padding:22px;
    }

    .card h3{
        font-size:22px;
    }

}

</style>
</head>

<body>

<!-- Background -->
<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<!-- Header -->
<div class="header">
    Daily Class Log Book
</div>

<!-- Welcome -->
<div class="welcome">
    Welcome, <strong id="teacherName"></strong>
</div>

<!-- Form -->
<div class="container">

    <div class="card">

        <h3>📘 Class Record Entry</h3>

        <label>Class</label>
        <select id="className">
            <option value="">Select Class</option>
            <option>Playgroup</option>
            <option>IK-1</option>
            <option>IK-2</option>
            <option>IK-3</option>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
            <option>Class 4</option>
            <option>Class 5</option>
        </select>

        <label>Date</label>
        <input type="date" id="logDate">

        <label>Subject</label>
        <input type="text" id="subject" placeholder="Enter Subject">

        <label>Topic Covered</label>
        <textarea id="topic" placeholder="Lesson / topic taught today"></textarea>

        <label>Class Activities</label>
        <textarea id="activities" placeholder="Activities conducted"></textarea>

        <label>Homework Given</label>
        <textarea id="homework" placeholder="Homework details"></textarea>

        <button onclick="saveLog()">
            Save Log Book
        </button>

    </div>

</div>

<!-- Popup -->
<div class="popup" id="popup">
    ✅ Log Book Saved Successfully
</div>

<script>

/* ---------------- FIREBASE CONFIG ---------------- */

const firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271",
  storageBucket: "students-6e271.firebasestorage.app",
  messagingSenderId: "336382170224",
  appId: "1:336382170224:web:21b2ace0bb69d5459810b5"
};

firebase.initializeApp(firebaseConfig);

/* ---------------- LOGIN SESSION ---------------- */

const teacher = localStorage.getItem("teacherName");

if(!teacher){
    alert("Please login again");
    window.location.href = "login.html";
}

document.getElementById("teacherName").innerText = teacher;

/* ---------------- AUTO DATE ---------------- */

document.getElementById("logDate").value =
new Date().toISOString().split("T")[0];

/* ---------------- SAVE LOG ---------------- */

function saveLog(){

    const className = document.getElementById("className").value;
    const date = document.getElementById("logDate").value;
    const subject = document.getElementById("subject").value;
    const topic = document.getElementById("topic").value;
    const activities = document.getElementById("activities").value;
    const homework = document.getElementById("homework").value;

    if(!className || !subject){

        alert("Class and Subject are required");
        return;
    }

    /* Unique Push ID */
    const newLogRef = firebase.database()
    .ref(`logbook/${className}/${date}`)
    .push();

    newLogRef.set({

        teacher: teacher,
        className: className,
        date: date,
        subject: subject,
        topic: topic,
        activities: activities,
        homework: homework,
        createdAt: Date.now()

    }).then(()=>{

        showPopup();

        document.getElementById("subject").value = "";
        document.getElementById("topic").value = "";
        document.getElementById("activities").value = "";
        document.getElementById("homework").value = "";

    });

}

/* ---------------- POPUP ---------------- */

function showPopup(){

    const popup = document.getElementById("popup");

    popup.classList.add("show");

    setTimeout(()=>{
        popup.classList.remove("show");
    },3000);

}

</script>

</body>
</html>
