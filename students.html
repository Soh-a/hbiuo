:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --dark-bg: #111827;
    --light-bg: #f3f4f6;
    --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background: var(--light-bg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* FULL-WIDTH MAIN WORKSPACE */
.main{
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px 20px;
    transition: all 0.3s ease;
}

/* TOPBAR */
.topbar{
    background: white;
    padding: 20px 25px;
    border-radius: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--card-shadow);
}

.topbar h1{
    font-size: 28px;
    color: var(--dark-bg);
}

.logout-btn{
    background: #ef4444;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}
.logout-btn:hover{ background: #dc2626; }

/* REVENUE DASHBOARD CARDS */
.stat-grid-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 16px;
    box-shadow: var(--card-shadow);
}

.stat-card h3 {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 6px;
}

.stat-card h2 {
    font-size: 28px;
    color: var(--dark-bg);
    font-weight: 700;
}

/* UTILITY UTILS BAR */
.utils-bar {
    margin-top: 25px;
    background: white;
    padding: 15px 20px;
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
}

.search-input, .filter-select {
    padding: 10px 15px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    background: #f9fafb;
}
.search-input { flex: 1; min-width: 250px; }
.filter-select { min-width: 160px; }

/* DATA TABLES PANEL */
.table-panel {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: var(--card-shadow);
    margin-top: 25px;
}

.table-panel h2 {
    font-size: 20px;
    color: var(--dark-bg);
    margin-bottom: 20px;
}

.table-container {
    overflow-x: auto;
    width: 100%;
}

.modern-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

.modern-table th {
    background: #f8fafc;
    color: #4b5563;
    padding: 14px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 2px solid #e2e8f0;
}

.modern-table td {
    padding: 14px;
    border-bottom: 1px solid #f1f5f9;
    color: #334155;
    font-size: 14px;
    white-space: nowrap;
}

.modern-table tr:hover {
    background: #f8fafc;
}

/* UTILITY LABELS AND SENSITIVE BLOCKS */
.credential-badge {
    background: #f1f5f9;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: 'Courier New', Courier, monospace;
    font-weight: 600;
    color: #0f172a;
    border: 1px solid #e2e8f0;
}

.fee-badge {
    color: #16a34a;
    font-weight: 600;
}
