<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERP Login</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  width:320px;
  border-radius:8px;
  box-shadow:0 0 12px rgba(0,0,0,.1);
}
h2{text-align:center;color:#1e40af}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:12px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}
#error{
  color:red;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
  <h2>ERP Login</h2>

  <select id="role">
    <option value="">Select Role</option>
    <option value="Teacher">Teacher</option>
    <option value="DV">DV</option>
  </select>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <p id="error"></p>
</div>

<script>
/* Firebase Config */
var firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
};
firebase.initializeApp(firebaseConfig);

function login(){
  const role = document.getElementById("role").value;
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  const error = document.getElementById("error");

  error.innerText = "";

  if(!role || !user || !pass){
    error.innerText = "All fields required";
    return;
  }

  /* 🔹 DV LOGIN (Fixed) */
  if(role === "DV"){
    if(user === "6002425951" && pass === "sai_drs"){
      localStorage.setItem("erpRole","DV");
      window.location.href = "index.html";
    }else{
      error.innerText = "Invalid DV credentials";
    }
    return;
  }

  /* 🔹 TEACHER LOGIN (Firebase) */
  firebase.database().ref("staff").once("value", snap=>{
    let found = false;

    snap.forEach(child=>{
      const s = child.val();
      if(
        s.role === "Teacher" &&
        s.username === user &&
        s.password === pass
      ){
        found = true;
        localStorage.setItem("erpRole","Teacher");
        localStorage.setItem("staffId",child.key);
        window.location.href = "teacher-dashboard.html";
      }
    });

    if(!found){
      error.innerText = "Invalid teacher credentials";
    }
  });
}
</script>

</body>
</html>
