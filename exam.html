<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Timetable Generator</title>
<style>
  body {font-family:Segoe UI;background:#f4f6f9;padding:20px;}
  input, select {padding:8px; margin:5px; width:180px;}
  button {padding:10px 20px; margin-top:10px;}
  table {width:100%; background:#fff; border-collapse:collapse; margin-top:20px;}
  th, td {padding:10px; border:1px solid #ddd; text-align:center;}
  th {background:#f1f5f9;}
</style>
</head>

<body>

<h2>Exam Details Entry</h2>

<!-- EXAM INPUT -->
<input id="examName" placeholder="Exam Name"><br>
<input id="className" placeholder="Class"><br>
<input id="subject" placeholder="Subject"><br>
<input type="date" id="date">
<input type="time" id="time"><br>
<input id="duration" placeholder="Duration (hrs)"><br>

<button onclick="addExam()">Add Exam</button>

<hr>

<h2>Generated Exam Timetable</h2>

<table id="timeTable">
<thead>
<tr>
  <th>Exam</th>
  <th>Class</th>
  <th>Subject</th>
  <th>Date</th>
  <th>Time</th>
  <th>Duration</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script src="exam.js"></script>
</body>
</html>
