<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERP Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  width:340px;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}
h2{text-align:center;color:#1e40af}

/* Role Switch */
.switch-box{text-align:center;margin:15px 0}
.switch{
  position:relative;
  width:220px;
  height:44px;
  background:#e5e7eb;
  border-radius:30px;
  cursor:pointer;
  margin:auto;
}
.slider{
  position:absolute;
  width:110px;
  height:44px;
  background:#2563eb;
  border-radius:30px;
  transition:.3s;
  left:0;
}
.switch span{
  position:absolute;
  width:110px;
  line-height:44px;
  text-align:center;
  font-weight:bold;
  z-index:2;
}
#teacherLbl{left:0;color:#fff}
#dvLbl{right:0;color:#111}

input,button{
  width:100%;
  padding:10px;
  margin-top:12px;
  font-size:15px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}
#error{text-align:center;color:red;margin-top:10px}
</style>
</head>

<body>

<div class="box">
  <h2>ERP Login</h2>

  <div class="switch-box">
    <div class="switch" onclick="toggleRole()">
      <div class="slider" id="slider"></div>
      <span id="teacherLbl">Teacher</span>
      <span id="dvLbl">DV</span>
    </div>
  </div>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <p id="error"></p>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
});

const db = firebase.database();
let role = "teacher";

/* Toggle Role */
function toggleRole(){
  const slider = document.getElementById("slider");
  const t = document.getElementById("teacherLbl");
  const d = document.getElementById("dvLbl");

  if(role === "teacher"){
    role = "dv";
    slider.style.left = "110px";
    t.style.color = "#111";
    d.style.color = "#fff";
  }else{
    role = "teacher";
    slider.style.left = "0";
    d.style.color = "#111";
    t.style.color = "#fff";
  }
}

/* LOGIN */
function login(){
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  const error = document.getElementById("error");
  error.innerText = "";

  if(!user || !pass){
    error.innerText = "All fields required";
    return;
  }

  /* ===== DV LOGIN ===== */
  if(role === "dv"){
    if(user === "6002425951" && pass === "sai_drs"){
      localStorage.setItem("isLoggedIn","true");
      localStorage.setItem("erpRole","dv");
      window.location.href = "index.html";
    }else{
      error.innerText = "Invalid DV credentials";
    }
    return;
  }

  /* ===== TEACHER LOGIN ===== */
  db.ref("staff").once("value").then(snapshot=>{
    let success = false;

    snapshot.forEach(child=>{
      const s = child.val();

      if(
        s.phone === user &&
        s.password === pass &&           // CASE SENSITIVE
        (s.role || "").toLowerCase() === "teacher" &&
        (s.status || "").toLowerCase() === "active"
      ){
        success = true;
        localStorage.setItem("isLoggedIn","true");
        localStorage.setItem("erpRole","teacher");
        localStorage.setItem("teacherId", child.key);
        localStorage.setItem("teacherName", s.name || "Teacher");
        window.location.href = "teacher-dashboard.html";
      }
    });

    if(!success){
      error.innerText = "Invalid Teacher credentials";
    }
  });
}
</script>

</body>
</html>
