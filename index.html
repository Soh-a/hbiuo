<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai DRS Kids – Finance Mobile Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
:root {
  --primary: #1e3a8a;
  --secondary: #64748b;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --bg: #f8fafc;
  --card-bg: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

body { display: flex; background: var(--bg); color: #1e293b; min-height: 100vh; overflow-x: hidden; }

/* Sidebar Responsive Logic */
.sidebar {
  width: 260px;
  background: var(--primary);
  color: #fff;
  padding: 30px 20px;
  position: fixed;
  height: 100vh;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease;
  z-index: 1000;
}

.sidebar h2 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar nav { flex: 1; }

.sidebar a {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #cbd5e1;
  padding: 14px 18px;
  text-decoration: none;
  border-radius: 12px;
  margin-bottom: 8px;
  transition: 0.2s;
}

.sidebar a.active { background: rgba(255, 255, 255, 0.1); color: #fff; }

.logout-btn { margin-top: auto; color: #fca5a5 !important; }

/* Main Content Area */
.main { flex: 1; margin-left: 260px; padding: 40px; transition: margin 0.3s ease; width: 100%; }

.mobile-header {
    display: none;
    background: #fff;
    padding: 15px 20px;
    border-bottom: 1px solid #e2e8f0;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 900;
}

.menu-btn { font-size: 1.5rem; color: var(--primary); cursor: pointer; }

.header-flex {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

/* KPI Cards */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: var(--card-bg);
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  border: 1px solid #f1f5f9;
}

.card h2 { font-size: 1.75rem; margin-top: 10px; font-weight: 700; color: #1e293b; }

/* Charts Layout */
.grid-2 {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 25px;
  margin-bottom: 30px;
}

.chart-box {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
}

/* Table Responsive Container */
.table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th { padding: 15px; background: #f8fafc; font-size: 0.75rem; color: var(--secondary); text-transform: uppercase; }
td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

.status-pill { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
.status-paid { background: #dcfce7; color: #166534; }
.status-unpaid { background: #fee2e2; color: #991b1b; }

/* Overlay for Mobile Sidebar */
.overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 950;
}

/* MEDIA QUERIES */
@media (max-width: 1024px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; padding: 20px; }
    .mobile-header { display: flex; }
    .overlay.active { display: block; }
    .grid-2 { grid-template-columns: 1fr; }
    .header-flex { flex-direction: column; align-items: flex-start; gap: 10px; }
}

@media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
  <h2><i class="fas fa-graduation-cap"></i> SAI DRS</h2>
  <nav>
    <a href="#" class="active"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="receipt.html"><i class="fas fa-receipt"></i> Receipts</a>  
    <a href="defaulters.html"><i class="fas fa-users-slash"></i> Defaulters</a>
  </nav>
  <a href="#" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<div style="flex: 1; display: flex; flex-direction: column;">
    <div class="mobile-header">
        <div class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div style="font-weight: 800; color: var(--primary);">SAI DRS KIDS</div>
        <div><i class="fas fa-user-circle"></i></div>
    </div>

    <div class="main">
        <div class="header-flex">
            <h2>Finance Dashboard</h2>
            <div style="font-size: 0.9rem; color: var(--secondary);">
                <span id="currentDate"></span>
            </div>
        </div>

        <div class="cards">
            <div class="card">
                <h4><i class="fas fa-wallet" style="color: var(--primary)"></i> Revenue</h4>
                <h2 id="totalRevenue">₹0</h2>
            </div>
            <div class="card">
                <h4><i class="fas fa-clock" style="color: var(--danger)"></i> Pending</h4>
                <h2 id="outstandingFees">₹0</h2>
            </div>
            <div class="card">
                <h4><i class="fas fa-calendar" style="color: var(--success)"></i> Monthly</h4>
                <h2 id="monthlyCollection">₹0</h2>
            </div>
            <div class="card">
                <h4><i class="fas fa-user-times" style="color: var(--warning)"></i> Defaulters</h4>
                <h2 id="defaultersCount">0</h2>
            </div>
        </div>

        <div class="grid-2">
            <div class="chart-box">
                <h4>Revenue Growth</h4>
                <canvas id="revenueChart"></canvas>
            </div>
            <div class="chart-box">
                <h4>Collection</h4>
                <canvas id="collectionChart"></canvas>
            </div>
        </div>

        <div class="chart-box">
            <h4>Transactions</h4>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Class</th>
                            <th>Fee</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
/* MOBILE TOGGLE LOGIC */
function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
}

/* DATE DISPLAY */
document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function formatINR(num){
  return "₹" + Number(num).toLocaleString("en-IN");
}

let revenueChart, collectionChart;

db.ref("/").on("value", snap => {
    let table = document.getElementById("transactionTable");
    table.innerHTML = "";

    let totalRevenue = 0, outstanding = 0, monthly = 0;
    let defaultersSet = new Set();
    let monthlyData = Array(12).fill(0);
    const currentMonth = new Date().getMonth();

    snap.forEach(child => {
        const key = child.key;
        const student = child.val();
        if(["attendance", "staff", "questions"].includes(key)) return;

        const name = student.name || key;
        const fee = Number(student.monthlyfee || 0);

        if(!student.fees) return;

        let hasPending = false;
        Object.keys(student.fees).forEach(month => {
            const d = student.fees[month] || {};
            const status = (d.status || "unpaid").toLowerCase();
            let date = d.paidAt ? new Date(d.paidAt) : new Date();

            if(status === "paid"){
                totalRevenue += fee;
                if(date.getMonth() === currentMonth) monthly += fee;
                monthlyData[date.getMonth()] += fee;
            } else {
                outstanding += fee;
                hasPending = true;
            }

            table.innerHTML += `
            <tr>
                <td><strong>${name}</strong></td>
                <td>${student.class || "-"}</td>
                <td>${formatINR(fee)}</td>
                <td><span class="status-pill status-${status}">${status}</span></td>
                <td>${date.toLocaleDateString('en-IN')}</td>
            </tr>`;
        });
        if(hasPending) defaultersSet.add(key);
    });

    document.getElementById("totalRevenue").innerText = formatINR(totalRevenue);
    document.getElementById("outstandingFees").innerText = formatINR(outstanding);
    document.getElementById("monthlyCollection").innerText = formatINR(monthly);
    document.getElementById("defaultersCount").innerText = defaultersSet.size;

    if(revenueChart) revenueChart.destroy();
    if(collectionChart) collectionChart.destroy();

    revenueChart = new Chart(document.getElementById("revenueChart"), {
        type:"line",
        data:{
            labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
            datasets:[{
                data:monthlyData,
                borderColor:"#1e3a8a",
                fill: true,
                tension: 0.3
            }]
        },
        options: { plugins: { legend: { display: false } } }
    });

    collectionChart = new Chart(document.getElementById("collectionChart"), {
        type:"doughnut",
        data:{
            labels:["Paid","Pending"],
            datasets:[{
                data:[totalRevenue, outstanding],
                backgroundColor:["#10b981","#ef4444"]
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } }, cutout: '70%' }
    });
});
</script>

</body>
</html>
