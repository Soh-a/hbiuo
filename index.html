<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai DRS Kids – Finance Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#f1f5f9;margin:0;display:flex}
.sidebar{width:250px;background:#1e3a8a;color:#fff;padding:20px;height:100vh}
.sidebar a{display:block;color:#fff;padding:10px;text-decoration:none;margin:5px 0}
.main{flex:1;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card{background:#fff;padding:15px;border-radius:10px}
.chart-box{background:#fff;margin-top:20px;padding:20px;border-radius:10px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd}
.status-paid{color:green}
.status-pending{color:red}
</style>
</head>

<body>

<div class="sidebar">
<h2>SAI DRS</h2>
<a href="#">Dashboard</a>
<a href="#">Receipts</a>
<a href="#">Receivable</a>
</div>

<div class="main">

<h2>Finance Dashboard</h2>

<div class="cards">
<div class="card">
<h4>Total Revenue</h4>
<h2 id="totalRevenue">₹0</h2>
</div>

<div class="card">
<h4>Outstanding</h4>
<h2 id="outstandingFees">₹0</h2>
</div>

<div class="card">
<h4>This Month</h4>
<h2 id="monthlyCollection">₹0</h2>
</div>

<div class="card">
<h4>Defaulters</h4>
<h2 id="defaultersCount">0</h2>
</div>
</div>

<div class="chart-box">
<h4>Revenue Trend</h4>
<canvas id="revenueChart"></canvas>
</div>

<div class="chart-box">
<h4>Collection vs Pending</h4>
<canvas id="collectionChart"></canvas>
</div>

<div class="chart-box">
<h4>Transactions</h4>
<table>
<thead>
<tr>
<th>Student</th>
<th>Class</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
</tr>
</thead>
<tbody id="transactionTable"></tbody>
</table>
</div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* FORMAT */
function formatINR(num){
  return "₹" + num.toLocaleString("en-IN");
}

/* VARIABLES */
let totalRevenue=0, outstanding=0, monthly=0, defaulters=0;
let monthlyData = Array(12).fill(0);

/* FETCH DATA */
db.ref("students").on("value", snap => {

    let table = document.getElementById("transactionTable");
    table.innerHTML="";

    totalRevenue=0;
    outstanding=0;
    monthly=0;
    defaulters=0;
    monthlyData = Array(12).fill(0);

    snap.forEach(studentSnap => {

        let student = studentSnap.val();
        let studentId = studentSnap.key;
        let studentClass = student.class || "-";
        let studentName = student.name || studentId;

        let fees = student.fees;
        if(!fees) return;

        Object.keys(fees).forEach(month => {

            let d = fees[month];

            let status = (d.status || "pending").toLowerCase();
            let date = new Date(d.paidAt || Date.now());

            // ✅ FIX: use monthlyFee
            let amount = Number(student.monthlyFee || 0);

            if(status === "paid"){
                totalRevenue += amount;

                if(new Date().getMonth() === date.getMonth()){
                    monthly += amount;
                }

                monthlyData[date.getMonth()] += amount;

            } else {
                outstanding += amount;
                defaulters++;
            }

            table.innerHTML += `
            <tr>
                <td>${studentName}</td>
                <td>${studentClass}</td>
                <td>${formatINR(amount)}</td>
                <td class="status-${status}">${status}</td>
                <td>${date.toLocaleDateString()}</td>
            </tr>`;
        });

    });

    updateUI();

});

/* UPDATE UI */
function updateUI(){
    document.getElementById("totalRevenue").innerText = formatINR(totalRevenue);
    document.getElementById("outstandingFees").innerText = formatINR(outstanding);
    document.getElementById("monthlyCollection").innerText = formatINR(monthly);
    document.getElementById("defaultersCount").innerText = defaulters;

    loadCharts();
}

/* CHARTS */
function loadCharts(){

    new Chart(document.getElementById("revenueChart"), {
        type:"line",
        data:{
            labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
            datasets:[{
                label:"Revenue",
                data:monthlyData,
                borderWidth:2,
                fill:false
            }]
        }
    });

    new Chart(document.getElementById("collectionChart"), {
        type:"doughnut",
        data:{
            labels:["Collected","Pending"],
            datasets:[{
                data:[totalRevenue,outstanding]
            }]
        }
    });

}

</script>

</body>
</html>
