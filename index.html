<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai DRS Kids – Finance Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#f1f5f9;margin:0;display:flex}
.sidebar{width:250px;background:#1e3a8a;color:#fff;padding:20px;height:100vh}
.sidebar a{display:block;color:#fff;padding:10px;text-decoration:none;margin:5px 0}
.main{flex:1;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card{background:#fff;padding:15px;border-radius:10px}
.chart-box{background:#fff;margin-top:20px;padding:20px;border-radius:10px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd}
.status-paid{color:green}
.status-unpaid{color:red}
</style>
</head>

<body>

<div class="sidebar">
<h2>SAI DRS</h2>
<a href="#">Dashboard</a>
</div>

<div class="main">

<h2>Finance Dashboard</h2>

<div class="cards">
<div class="card"><h4>Total Revenue</h4><h2 id="totalRevenue">₹0</h2></div>
<div class="card"><h4>Outstanding</h4><h2 id="outstandingFees">₹0</h2></div>
<div class="card"><h4>This Month</h4><h2 id="monthlyCollection">₹0</h2></div>
<div class="card"><h4>Defaulters</h4><h2 id="defaultersCount">0</h2></div>
</div>

<div class="chart-box">
<h4>Revenue Trend</h4>
<canvas id="revenueChart"></canvas>
</div>

<div class="chart-box">
<h4>Collection vs Pending</h4>
<canvas id="collectionChart"></canvas>
</div>

<div class="chart-box">
<h4>Transactions</h4>
<table>
<thead>
<tr>
<th>Student</th>
<th>Class</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
</tr>
</thead>
<tbody id="transactionTable"></tbody>
</table>
</div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain: "students-6e271.firebaseapp.com",
  databaseURL: "https://students-6e271-default-rtdb.firebaseio.com",
  projectId: "students-6e271"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* FORMAT */
function formatINR(num){
  return "₹" + Number(num).toLocaleString("en-IN");
}

/* CHART INSTANCES */
let revenueChart, collectionChart;

/* LOAD DATA */
db.ref("/").on("value", snap => {

    let table = document.getElementById("transactionTable");
    table.innerHTML = "";

    let totalRevenue = 0;
    let outstanding = 0;
    let monthly = 0;
    let defaultersSet = new Set();
    let monthlyData = Array(12).fill(0);

    const currentMonth = new Date().getMonth();

    snap.forEach(child => {

        const key = child.key;
        const student = child.val();

        // ❌ Skip non-student nodes
        if(key === "attendance" || key === "staff" || key === "questions") return;

        const name = student.name || key;
        const studentClass = student.class || "-";

        // ✅ FIX: correct field name
        const fee = Number(student.monthlyfee || 0);

        if(!student.fees) return;

        let hasPending = false;

        Object.keys(student.fees).forEach(month => {

            const d = student.fees[month] || {};
            const status = (d.status || "unpaid").toLowerCase();

            let date = d.paidAt ? new Date(d.paidAt) : new Date();

            if(status === "paid"){
                totalRevenue += fee;

                if(date.getMonth() === currentMonth){
                    monthly += fee;
                }

                monthlyData[date.getMonth()] += fee;

            } else {
                outstanding += fee;
                hasPending = true;
            }

            table.innerHTML += `
            <tr>
                <td>${name}</td>
                <td>${studentClass}</td>
                <td>${formatINR(fee)}</td>
                <td class="status-${status}">${status}</td>
                <td>${date.toLocaleDateString()}</td>
            </tr>`;
        });

        if(hasPending){
            defaultersSet.add(key);
        }

    });

    // UI UPDATE
    document.getElementById("totalRevenue").innerText = formatINR(totalRevenue);
    document.getElementById("outstandingFees").innerText = formatINR(outstanding);
    document.getElementById("monthlyCollection").innerText = formatINR(monthly);
    document.getElementById("defaultersCount").innerText = defaultersSet.size;

    // DESTROY OLD CHARTS
    if(revenueChart) revenueChart.destroy();
    if(collectionChart) collectionChart.destroy();

    // REVENUE CHART
    revenueChart = new Chart(document.getElementById("revenueChart"), {
        type:"line",
        data:{
            labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
            datasets:[{
                label:"Revenue",
                data:monthlyData,
                borderWidth:2
            }]
        }
    });

    // PIE CHART
    collectionChart = new Chart(document.getElementById("collectionChart"), {
        type:"doughnut",
        data:{
            labels:["Collected","Pending"],
            datasets:[{
                data:[totalRevenue,outstanding]
            }]
        }
    });

});

</script>

</body>
</html>
