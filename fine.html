<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fine Manager</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
  font-family:Segoe UI;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
}
.container{
  max-width:800px;
  margin:30px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.1);
}
input,button,select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}
button{background:#ff4d4d;color:#fff;cursor:pointer}
.success{color:#4ade80}
.error{color:#f87171}
.box{
  margin-top:15px;
  padding:10px;
  background:rgba(255,255,255,0.08);
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>Fine Manager (Simple)</h2>

<input id="mobile" placeholder="Enter Mobile (empty = all)">
<button onclick="loadStudents()">Load Students</button>

<!-- Month Dropdown -->
<select id="monthSelect">
  <option value="">-- Select Month (All if empty) --</option>
  <option>April</option>
  <option>May</option>
  <option>June</option>
  <option>July</option>
  <option>August</option>
  <option>September</option>
  <option>October</option>
  <option>November</option>
  <option>December</option>
  <option>January</option>
  <option>February</option>
  <option>March</option>
</select>

<div id="list"></div>

<input id="fine" type="number" placeholder="Fine Amount ₹">

<button onclick="autoFine()">⚡ Auto Apply Fine</button>
<button onclick="removeFine()">❌ Remove Fine</button>
<button onclick="downloadReport()">📥 Download Report</button>

<div id="msg"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  databaseURL:"https://students-6e271-default-rtdb.firebaseio.com"
});

const db = firebase.database();
let students={};

// LOAD STUDENTS
function loadStudents(){
  let mobile=document.getElementById("mobile").value.trim();

  if(mobile){
    db.ref(mobile).once("value",s=>{
      students={[mobile]:s.val()};
      render();
    });
  }else{
    db.ref().once("value",s=>{
      students=s.val()||{};
      render();
    });
  }
}

// RENDER UI
function render(){
  let html="";
  for(let m in students){
    let s=students[m];
    if(!s || !s.name) continue;

    html+=`
    <div class="box">
      <label>
        <input type="checkbox" class="student" value="${m}">
        <b>${s.name}</b>
      </label>
    </div>`;
  }
  list.innerHTML=html;
}

// AUTO FINE
function autoFine(){
  let fine=document.getElementById("fine").value;
  let selectedMonth=document.getElementById("monthSelect").value;

  if(!fine){
    msg.innerHTML="<p class='error'>Enter fine</p>";
    return;
  }

  document.querySelectorAll(".student:checked").forEach(st=>{
    let mob=st.value;
    let s=students[mob];

    if(!s.fees) return;

    for(let month in s.fees){

      if(selectedMonth && month !== selectedMonth) continue;

      if(s.fees[month].status!="paid"){

        let path=`${mob}/fees/${month}`;

        db.ref(path+"/fine").set(Number(fine));

        db.ref(path+"/fineHistory").push({
          amount:Number(fine),
          date:new Date().toLocaleString()
        });
      }
    }
  });

  msg.innerHTML="<p class='success'>✅ Fine Applied</p>";
}

// REMOVE FINE
function removeFine(){
  let selectedMonth=document.getElementById("monthSelect").value;

  document.querySelectorAll(".student:checked").forEach(st=>{
    let mob=st.value;
    let s=students[mob];

    if(!s.fees) return;

    for(let month in s.fees){

      if(selectedMonth && month !== selectedMonth) continue;

      db.ref(`${mob}/fees/${month}/fine`).remove();
    }
  });

  msg.innerHTML="<p class='success'>❌ Fine Removed</p>";
}

// DOWNLOAD REPORT
function downloadReport(){
  let csv="Name,Month,Fine,Date\n";

  for(let mob in students){
    let s=students[mob];
    if(!s || !s.fees) continue;

    for(let m in s.fees){
      let f=s.fees[m];

      if(f.fineHistory){
        for(let id in f.fineHistory){
          let h=f.fineHistory[id];
          csv+=`${s.name},${m},${h.amount},${h.date}\n`;
        }
      }
    }
  }

  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="fine_report.csv";
  a.click();
}
</script>

<!-- Footer -->
<footer style="text-align:center;padding:10px;font-size:12px;color:#2563eb;font-family:Arial;margin-top:20px;">
This system was developed with the assistance of AI tools.
</footer>

</body>
</html>
