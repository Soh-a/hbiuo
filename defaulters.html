<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Defaulters List</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#16a34a;
  --primary-dark:#15803d;
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#1f2937;
}

/* Page */
body{
  margin:0;
  font-family: "Segoe UI", Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* Container */
.container{
  max-width:1100px;
  margin:40px auto;
  background:var(--card);
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* Heading */
h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
}

/* Actions */
.actions{
  display:flex;
  justify-content:flex-end;
  margin-bottom:15px;
}

#downloadBtn{
  padding:10px 18px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}
#downloadBtn:hover{
  background:var(--primary-dark);
}

/* Table */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:12px 14px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--primary);
  color:#fff;
  font-weight:500;
}

tr:nth-child(even){
  background:#f9fafb;
}

tr:hover{
  background:#ecfdf5;
}
</style>
</head>

<body>

<div class="container">
  <h2>Defaulters List</h2>

  <div class="actions">
    <button id="downloadBtn">⬇ Download CSV</button>
  </div>

  <div class="table-wrap">
    <table id="defaultersTable">
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Month</th>
          <th>Fine</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- JS -->
<script type="module" src="defaulters.js"></script>
</body>
</html>
