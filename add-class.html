<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Class</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase v8 (recommended for HTML projects) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.header {
    background: #2e7d32;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.container {
    padding: 20px;
    max-width: 420px;
    margin: auto;
}

.card {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    border: none;
    background: #2e7d32;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #256528;
}
</style>
</head>

<body>

<div class="header">Add Class</div>

<div class="container">
    <div class="card">
        <input type="text" id="className" placeholder="Class (e.g. Class 3)">
        <input type="text" id="section" placeholder="Section (e.g. A)">
        <input type="text" id="subject" placeholder="Subject (e.g. Math)">

        <select id="day">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
        </select>

        <input type="time" id="time">

        <button onclick="addClass()">Save Class</button>
    </div>
</div>

<script>
/* ================================
   Firebase Configuration
================================ */
var firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

/* ================================
   Add Class Function
================================ */
function addClass() {
    var staffId = localStorage.getItem("staffId");

    if (!staffId) {
        alert("Login required");
        window.location.href = "login.html";
        return;
    }

    var className = document.getElementById("className").value.trim();
    var section = document.getElementById("section").value.trim();
    var subject = document.getElementById("subject").value.trim();
    var day = document.getElementById("day").value;
    var time = document.getElementById("time").value;

    if (!className || !section || !subject || !day || !time) {
        alert("Please fill all fields");
        return;
    }

    var ref = db.ref("staff/" + staffId + "/timetable").push();

    ref.set({
        class: className,
        section: section,
        subject: subject,
        day: day,
        time: time
    }).then(() => {
        alert("Class added successfully");
        window.location.href = "teacher-dashboard.html";
    }).catch(err => {
        alert("Error: " + err.message);
    });
}
</script>

</body>
</html>
