<!DOCTYPE html>
<html>
<head>
  <title>Attendance Calculator</title>
  <style>
    /* Reset and basic */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; color: #333; padding: 30px; }

    h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; }

    /* Upload section */
    #uploadSection { text-align: center; margin-bottom: 30px; }
    #uploadSection p { font-size: 16px; color: #555; margin-bottom: 10px; }
    input[type="file"] { padding: 10px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; }

    /* Processing */
    #processing { text-align: center; font-weight: bold; color: #4CAF50; margin-bottom: 20px; font-size: 16px; }

    /* Result container */
    #result { max-width: 700px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #result ul { list-style-type: none; padding-left: 0; margin-bottom: 15px; }
    #result li { padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; border-radius: 6px; transition: background 0.2s; }
    #result li:hover { background: #f1f9f5; }
    #result p { text-align: center; font-size: 18px; font-weight: bold; color: #2c3e50; }

    /* Responsive */
    @media (max-width: 768px) {
      #result { width: 95%; padding: 15px; }
    }
  </style>
</head>
<body>

<h2>Attendance Calculator</h2>

<div id="uploadSection">
  <p>Upload a clear photo of the class register (typed or neatly written)</p>
  <input type="file" id="registerPhoto" accept="image/*">
</div>

<div id="processing"></div>
<div id="result"></div>

<!-- Include Tesseract.js -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<script type="module" src="attendance.js"></script>

</body>
</html>
