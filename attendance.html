<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Marking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#e0f7ff,#fff8dc);
  animation:bgMove 15s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* HEADER */
.header{
  margin:20px;
  padding:18px 25px;
  border-radius:18px;
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(15px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  animation:fadeDown .8s ease forwards;
}
.header div:first-child{
  font-size:20px;
  font-weight:600;
  color:#0f3c78;
}
#teacherName{
  color:#b8860b;
  font-weight:600;
}

@keyframes fadeDown{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}

/* CONTROLS */
.controls{
  margin:20px;
  padding:20px;
  border-radius:18px;
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(15px);
  display:flex;
  gap:15px;
  box-shadow:0 8px 25px rgba(0,0,0,.1);
}

select,input{
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.4);
  font-size:14px;
}
select:focus,input:focus{
  outline:none;
  border-color:#d4af37;
  box-shadow:0 0 6px #d4af37;
}

/* TABLE */
table{
  width:calc(100% - 40px);
  margin:20px;
  border-collapse:collapse;
  background:rgba(255,255,255,.3);
  backdrop-filter:blur(16px);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  animation:fadeUp .8s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

th,td{
  padding:14px;
  text-align:center;
}
th{
  background:linear-gradient(135deg,#ccefff,#ffeaa7);
  color:#0f3c78;
}
tr{
  transition:.3s;
}
tr:hover{
  background:rgba(255,255,255,.35);
}

.present{color:#16a34a;font-weight:600}
.absent{color:#dc2626;font-weight:600}

/* BUTTONS */
button{
  padding:6px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
}
.btn-present{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;
}
.btn-absent{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  color:#fff;
}
button:hover{
  transform:scale(1.1);
}

/* FOOTER */
.footer{
  margin:20px;
  text-align:right;
}
.save-btn{
  padding:12px 22px;
  font-size:15px;
  font-weight:600;
  border-radius:14px;
  background:linear-gradient(135deg,#38bdf8,#d4af37);
  color:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}
.save-btn:hover{
  transform:translateY(-3px);
}
</style>
</head>

<body>

<div class="header">
  <div>📋 Attendance Marking</div>
  <div id="teacherName"></div>
</div>

<div class="controls">
  <select id="classSelect" onchange="loadStudents()">
    <option value="">Select Class</option>
    <option value="IK-1">IK-1</option>
    <option value="IK-2">IK-2</option>
    <option value="IK-3">IK-3</option>
    <option value="1">Class 1</option>
    <option value="2">Class 2</option>
    <option value="3">Class 3</option>
    <option value="4">Class 4</option>
  </select>

  <input type="date" id="attendanceDate">
</div>

<table>
<thead>
<tr>
  <th>Roll</th>
  <th>Student Name</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="studentRows"></tbody>
</table>

<div class="footer">
  <button class="save-btn" onclick="saveAttendance()">💾 Save Attendance</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* LOGIN CHECK */
const role = localStorage.getItem("erpRole");
if(role !== "teacher"){
  alert("Teacher login required");
  location.href="login.html";
}
teacherName.innerText="Hi, "+(localStorage.getItem("teacherName")||"Teacher");

/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyC31nwqHDXPRC7WW0iEc5BImAqNa2-dTbc",
  authDomain:"students-6e271.firebaseapp.com",
  databaseURL:"https://students-6e271-default-rtdb.firebaseio.com",
  projectId:"students-6e271"
});
const db=firebase.database();
let students={};

/* LOAD STUDENTS */
function loadStudents(){
  const cls=classSelect.value;
  studentRows.innerHTML="";
  students={};
  if(!cls) return;

  db.ref("/").once("value",snap=>{
    let roll=1;
    snap.forEach(c=>{
      const s=c.val();
      if(s && s.name && s.class===cls){
        students[c.key]={roll:roll++,name:s.name,status:"Present"};
      }
    });

    if(!Object.keys(students).length){
      studentRows.innerHTML=`<tr><td colspan="4">❌ No students found</td></tr>`;
      return;
    }

    Object.keys(students).forEach(id=>{
      const s=students[id];
      studentRows.innerHTML+=`
      <tr>
        <td>${s.roll}</td>
        <td>${s.name}</td>
        <td id="status-${id}" class="present">Present</td>
        <td>
          <button class="btn-present" onclick="mark('${id}','Present')">P</button>
          <button class="btn-absent" onclick="mark('${id}','Absent')">A</button>
        </td>
      </tr>`;
    });
  });
}

/* MARK */
function mark(id,status){
  students[id].status=status;
  const c=document.getElementById("status-"+id);
  c.innerText=status;
  c.className=status==="Present"?"present":"absent";
}

/* SAVE */
function saveAttendance(){
  if(!classSelect.value||!attendanceDate.value){
    alert("Select class and date");return;
  }
  let up={};
  Object.keys(students).forEach(id=>{
    up[`attendance/${classSelect.value}/${attendanceDate.value}/${id}`]=students[id];
  });
  db.ref().update(up).then(()=>alert("✅ Attendance saved"));
}

/* INIT DATE */
attendanceDate.value=new Date().toISOString().split("T")[0];
</script>

</body>
</html>
